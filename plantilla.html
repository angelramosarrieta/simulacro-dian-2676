<title>Simulador de concurso CNSC</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: app de una columna (máx. 680px) con barra superior, contenido y barra de pestañas inferior fija; las vistas de examen ocupan la pantalla sin pestañas */
:root{
  --bg:#F6F6F4; --surface:#FFFFFF; --soft:#EFEFEB; --ink:#15171B; --muted:#6A6F77; --line:#E3E3DE;
  --accent:#0E6B58; --on-accent:#FFFFFF; --accent-soft:#E2EFEA;
  --ok:#157A43; --ok-soft:#E5F3EA; --bad:#B42318; --bad-soft:#FBEAE8;
  --sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D0F12; --surface:#15181C; --soft:#1B1F24; --ink:#ECEDEF; --muted:#8E949C; --line:#252A30;
  --accent:#4FC2A4; --on-accent:#06231C; --accent-soft:#11302A;
  --ok:#4ADE80; --ok-soft:#0F2A1B; --bad:#F68B80; --bad-soft:#331715; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D0F12; --surface:#15181C; --soft:#1B1F24; --ink:#ECEDEF; --muted:#8E949C; --line:#252A30;
  --accent:#4FC2A4; --on-accent:#06231C; --accent-soft:#11302A;
  --ok:#4ADE80; --ok-soft:#0F2A1B; --bad:#F68B80; --bad-soft:#331715; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,p{margin:0}
h1{font-size:1.75rem;font-weight:600;letter-spacing:-.025em;line-height:1.15;text-wrap:balance}
h2{font-size:.78rem;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:680px;margin:0 auto}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}

/* barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.top .inner{display:flex;align-items:center;justify-content:space-between;height:56px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.01em}
.mark{width:28px;height:28px;border-radius:8px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--mono);font-size:.72rem;font-weight:500}
.top-r{display:flex;align-items:center;gap:6px}
.chip{font-family:var(--mono);font-size:.75rem;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;color:var(--muted)}
.icon-btn:hover{background:var(--soft);color:var(--ink)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* contenido */
.view{padding-block:24px calc(96px + env(safe-area-inset-bottom,0px))}
.view .inner{display:flex;flex-direction:column;gap:28px}
.stack{display:flex;flex-direction:column;gap:12px}

/* pestañas inferiores */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .inner{display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 8px;font-size:.7rem;font-weight:500;color:var(--muted)}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] svg.i{stroke-width:2.1}

/* inicio */
.hero{display:flex;flex-direction:column;gap:6px}
.big{font-size:3.6rem;font-weight:600;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:1.1rem;font-weight:500;letter-spacing:-.01em;color:var(--muted);margin-left:6px}
.cta{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;text-align:left;padding:18px 20px;border-radius:var(--r);background:var(--ink);color:var(--bg)}
.cta b{display:block;font-weight:600;font-size:1.02rem}
.cta span.s{display:block;font-size:.84rem;opacity:.7}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi+.kpi{border-left:1px solid var(--line)}
.kpi b{font-size:1.35rem;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi span{font-size:.75rem;color:var(--muted)}

/* listas */
.list{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 14px;width:100%;text-align:left;padding:14px 16px;min-height:56px}
.row+.row{border-top:1px solid var(--line)}
button.row:hover{background:var(--soft)}
.row .t{font-weight:500;min-width:0}
.row .d{font-size:.8rem;color:var(--muted);grid-column:1}
.row .r{grid-row:1/span 2;grid-column:2;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.8rem}
.row .meter{grid-column:1/-1;height:3px;border-radius:3px;background:var(--soft);overflow:hidden;margin-top:6px}
.row .meter i{display:block;height:100%;background:var(--accent)}
.row .meter i.low{background:var(--bad)}
.badge{font-size:.68rem;font-weight:600;letter-spacing:.03em;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:12px;background:var(--soft)}
.seg button{padding:8px;border-radius:9px;font-size:.85rem;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.label{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.empty{padding:16px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);font-size:.9rem}
.note{font-size:.82rem;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;font-weight:500;border:1px solid var(--line);background:var(--surface);min-height:46px}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.link{color:var(--muted);font-size:.85rem;text-decoration:underline;text-underline-offset:3px;padding:8px 0}
.confirm{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:var(--r);background:var(--bad-soft)}
.confirm .acts{display:flex;gap:8px}

/* guía */
.guide details{border-top:1px solid var(--line)}
.guide details:last-child{border-bottom:1px solid var(--line)}
.guide summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:16px 0;font-weight:500;cursor:pointer}
.guide summary::-webkit-details-marker{display:none}
.guide summary::after{content:"+";font-family:var(--mono);color:var(--muted);font-size:1.1rem}
.guide details[open] summary::after{content:"−"}
.guide ul{margin:0 0 16px;padding-left:18px;display:flex;flex-direction:column;gap:8px;color:var(--ink);font-size:.92rem}
.guide li::marker{color:var(--muted)}

/* bloqueo */
.lock{min-height:100%;display:flex;align-items:center;justify-content:center;padding-block:40px}
.lockbox{width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center;gap:28px;text-align:center}
.lockbox .mark{width:48px;height:48px;border-radius:14px;font-size:1rem}
.lockbox h1{font-size:1.5rem}
.dots{display:flex;gap:14px;height:14px}
.dots i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--muted)}
.dots i.on{background:var(--ink);border-color:var(--ink)}
.dots.err{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.err-msg{color:var(--bad);font-size:.85rem;min-height:1.3em}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px 22px}
.pad button{width:72px;height:72px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-size:1.5rem;font-weight:400;font-variant-numeric:tabular-nums}
.pad button:active{background:var(--soft)}
.pad button.ghost{background:none;border-color:transparent;color:var(--muted)}

/* examen */
.qbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.qbar .inner{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:8px;height:56px}
.qmeta{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.qmeta b{font-weight:500;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qmeta span{font-size:.75rem;color:var(--muted)}
.timer{font-family:var(--mono);font-size:.85rem;padding:4px 10px;border-radius:999px;background:var(--soft);font-variant-numeric:tabular-nums}
.timer.low{background:var(--bad-soft);color:var(--bad)}
.prog{height:2px;background:var(--line)}
.prog i{display:block;height:100%;background:var(--ink);transition:width .25s ease}
.quiz{padding-block:20px calc(110px + env(safe-area-inset-bottom,0px))}
.quiz .inner{display:flex;flex-direction:column;gap:18px}
.kicker{font-size:.72rem;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.caso{padding:14px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.qtext{font-size:1.15rem;font-weight:500;letter-spacing:-.01em;line-height:1.45}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);transition:border-color .15s,background .15s}
.opt .l{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-family:var(--mono);font-size:.8rem;background:var(--soft);color:var(--muted)}
.opt:hover:not([disabled]){border-color:var(--muted)}
.opt.sel{border-color:var(--ink)} .opt.sel .l{background:var(--ink);color:var(--bg)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)} .opt.ok .l{background:var(--ok);color:var(--surface)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)} .opt.bad .l{background:var(--bad);color:var(--surface)}
.opt[disabled]{cursor:default}
.fb{display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:12px;font-size:.92rem;border-left:3px solid var(--muted);background:var(--surface)}
.fb.ok{border-left-color:var(--ok)} .fb.bad{border-left-color:var(--bad)} .fb.info{border-left-color:var(--accent)}
.fb strong{font-weight:600}
.ref{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.qnav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px))}
.qnav .inner{display:flex;gap:10px}
.qnav .btn{flex:1}
.grid{display:flex;flex-wrap:wrap;gap:6px}
.grid button{width:34px;height:34px;border-radius:9px;font-family:var(--mono);font-size:.75rem;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.grid button.done{background:var(--soft);color:var(--ink)}
.grid button.cur{border-color:var(--ink);color:var(--ink)}

/* resultados */
.pill{display:inline-flex;font-size:.75rem;font-weight:500;padding:3px 10px;border-radius:999px}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.rv{padding:16px;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.rv+.rv{border-top:1px solid var(--line)}
.rv .yours{color:var(--bad)} .rv .right{color:var(--ok);font-weight:500}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app"></div>

<script>
// ===================== CONFIGURACIÓN DEL CARGO =====================
// Junto con el banco de preguntas (const Q), es lo único que cambia de un cargo a otro.
// Reemplaza cada valor entre [CORCHETES] con los datos del manual de funciones, los indicadores y la guía.
const CONFIG={
  clave:"[CLAVE]",            // identificador corto y único (ej.: "4021"): separa el PIN y el progreso de otros simuladores
  marca:"[XX]",               // 2 o 3 caracteres para el logo (ej.: "21")
  titulo:"[Simulacro XXXX]",  // nombre corto que aparece arriba
  proceso:"[Proceso de selección]",
  entidad:"[la entidad]",     // con artículo: "la DIAN", "el ICBF"
  cargo:"[Denominación del empleo]",
  opec:"[OPEC]",
  examen:"2099-01-01",        // fecha de la prueba escrita (AAAA-MM-DD)
  examenTexto:"[Día y fecha · hora de inicio · hora de cierre de puertas]",
  minimo:70,                  // puntaje mínimo aprobatorio de la prueba funcional, según la guía
  // Ejes o indicadores oficiales del empleo, escritos igual que en el campo "t" de las preguntas
  ejes:["[Eje oficial 1]","[Eje oficial 2]"],
  guiaFuente:"[Guía de Orientación al Aspirante (CNSC, mes de año)]",
  // Resumen de la guía: cada bloque es una sección desplegable; los items admiten <b> e <i>
  guia:[
    {titulo:"Cómo se califica",items:["[Carácter, peso y puntaje mínimo de cada prueba para tu nivel y modalidad]"]},
    {titulo:"Formato de las preguntas",items:["[Formato de la prueba funcional y de la comportamental]"]},
    {titulo:"Día del examen",items:["[Horario, cierre de puertas y permanencia mínima]"]},
    {titulo:"Qué llevar",items:["[Documentos válidos y elementos permitidos o prohibidos]"]},
    {titulo:"Hoja de respuestas",items:["[Cómo marcar]"]},
    {titulo:"Resultados y reclamaciones",items:["[Publicación y plazos de reclamación]"]}
  ]
};
const EXAM=new Date(CONFIG.examen+"T00:00:00");
const COMP = "Comportamental e integridad";
// ===================== BANCO DE PREGUNTAS =====================
// Tres tipos de ítem. La clave va SIEMPRE en la posición 0 (a:0); la app baraja las opciones al mostrarlas.
// Agrega las preguntas nuevas al FINAL del arreglo para no dañar el progreso guardado.
const Q = [
// 1) Pregunta directa: t (eje), q (enunciado), o (3 opciones), a, e (explicación), r (referencia normativa)
{t:"[Eje oficial 1]",q:"[Ejemplo] Por regla general, ¿en qué término se responde un derecho de petición?",o:["15 días siguientes a su recepción","10 días siguientes a su recepción","30 días siguientes a su recepción"],a:0,e:"Regla general: 15 días. Documentos: 10 días. Consultas: 30 días.",r:"Ley 1755/2015 art. 14"},
// 2) Caso tipo examen (juicio situacional): p:1, cs (caso), q (enunciado incompleto), o (3), a, j (justificación de cada opción), r
{t:"[Eje oficial 2]",p:1,cs:"[Ejemplo] Un ciudadano pregunta en el punto de servicio por el estado de una solicitud que radicó hace unos días. El funcionario encuentra en la plataforma la etapa del trámite y el responsable.",q:"Con base en la información disponible, al funcionario le corresponde",o:["informar al ciudadano la etapa en la que está la solicitud e indicarle el canal para consultar su avance.","indicarle qué dependencia tiene la solicitud para que vaya allí a preguntar.","pedirle que espere la respuesta dentro del plazo legal."],a:0,j:["Correcta. Toda persona tiene derecho a conocer el estado de sus trámites, y la información está disponible.","Incorrecta. Le impone un paso adicional para obtener un dato que el funcionario ya tiene.","Incorrecta. No responde la pregunta sobre el estado, que puede conocer mientras el trámite está en curso."],r:"Ley 1437/2011 art. 5"},
// 3) Afirmación comportamental o de integridad (Likert, sin respuesta correcta): t:COMP, lk:1, k (competencia o valor), q
{t:COMP,lk:1,k:"Orientación al usuario y al ciudadano",q:"[Ejemplo] Explico los trámites con palabras sencillas, aunque la atención me tome más tiempo."}
].map((x,i)=>({...x,id:i}));

const TOPICS=[...new Set(Q.map(x=>x.t))];
const LK=["Totalmente en desacuerdo","En desacuerdo","De acuerdo","Totalmente de acuerdo"];
const QG=Q.filter(q=>!q.lk);
const EJES=CONFIG.ejes;
const OTROS=TOPICS.filter(t=>t!==COMP&&!EJES.includes(t));
const inEje=q=>!q.lk&&EJES.includes(q.t);

// ---------- almacenamiento local (puede fallar: todo va en try/catch) ----------
const NS="simulacro"+CONFIG.clave;
const KEY=NS+":v1", HKEY=NS+":hist", PKEY=NS+":pin", OKEY=NS+":open";
function get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function put(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function storageOK(){try{localStorage.setItem("_t","1");localStorage.removeItem("_t");return true}catch(e){return false}}
function isOpen(){try{return sessionStorage.getItem(OKEY)==="1"}catch(e){return false}}
function setOpen(v){try{v?sessionStorage.setItem(OKEY,"1"):sessionStorage.removeItem(OKEY)}catch(e){}}
let stats=get(KEY)||{}, hist=get(HKEY)||[];
let S=null, timerId=null, simSize=30, tab="inicio", lockState=null;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function record(q,ok){if(q.lk)return;const s=stats[q.id]||{n:0,ok:0,last:null};s.n++;if(ok)s.ok++;s.last=ok;stats[q.id]=s;put(KEY,stats)}
function wrongIds(){return QG.filter(q=>stats[q.id]&&stats[q.id].last===false).map(q=>q.id)}
// Escala 0-100 con dos decimales truncados, como califica la CNSC (GOA 4.7)
function score(ok,n){return n?Math.floor(ok*10000/n)/100:0}
function fmt(x){return x.toFixed(2).replace(".",",")}
function topicStats(t){const qs=QG.filter(q=>q.t===t),seen=qs.filter(q=>stats[q.id]);
  const n=seen.reduce((a,q)=>a+stats[q.id].n,0),ok=seen.reduce((a,q)=>a+stats[q.id].ok,0);
  return {total:qs.length,seen:seen.length,acc:n?ok/n:null}}
function daysLeft(){const t=new Date();t.setHours(0,0,0,0);return Math.round((EXAM-t)/864e5)}
const $=s=>document.querySelector(s);
const app=$("#app");

const I={
  home:'<svg class="i" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  play:'<svg class="i" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>',
  chart:'<svg class="i" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  book:'<svg class="i" viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M8 7h7"/></svg>',
  lock:'<svg class="i" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  x:'<svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  arrow:'<svg class="i" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  chev:'<svg class="i" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="m9 6 6 6-6 6"/></svg>',
  del:'<svg class="i" viewBox="0 0 24 24"><path d="M9 5h11v14H9l-6-7z"/><path d="m12 9 5 6M17 9l-5 6"/></svg>'
};

// ---------- bloqueo con PIN (privacidad en este dispositivo) ----------
async function hashPin(p){
  try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("s"+CONFIG.clave+"|"+p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
  catch(e){let h=7;for(const c of "s"+CONFIG.clave+"|"+p)h=(h*31+c.charCodeAt(0))|0;return "f"+h}
}
function lockScreen(){
  clearInterval(timerId);S=null;setOpen(false);
  const has=!!get(PKEY);
  lockState={stage:has?"enter":"create",first:"",buf:"",err:"",forgot:false};
  drawLock();
}
function drawLock(){
  const L=lockState;
  const title={enter:"Ingresa tu PIN",create:"Crea un PIN de 4 dígitos",confirm:"Confirma tu PIN"}[L.stage];
  app.innerHTML=`<main class="lock gut"><div class="lockbox">
    <span class="mark">${esc(CONFIG.marca)}</span>
    <div class="stack" style="gap:6px"><h1>${title}</h1><p class="muted">${esc(CONFIG.titulo)} · ${esc(CONFIG.cargo)}</p></div>
    <div class="dots${L.err?" err":""}" aria-label="${L.buf.length} de 4 dígitos">${[0,1,2,3].map(i=>`<i class="${i<L.buf.length?"on":""}"></i>`).join("")}</div>
    <p class="err-msg" role="alert">${esc(L.err)}</p>
    <div class="pad">${["1","2","3","4","5","6","7","8","9","","0","del"].map(k=>k===""?"<span></span>":k==="del"?`<button class="ghost" data-k="del" aria-label="Borrar">${I.del}</button>`:`<button data-k="${k}">${k}</button>`).join("")}</div>
    ${L.stage==="enter"?(L.forgot?`<div class="confirm" style="text-align:left"><p>Restablecer borra el PIN y tu progreso guardado en este dispositivo.</p><div class="acts"><button class="btn" id="nf">Cancelar</button><button class="btn danger" id="yf">Restablecer</button></div></div>`:`<button class="link" id="forgot">¿Olvidaste el PIN?</button>`)
      :`<p class="note">El PIN solo se guarda cifrado en este dispositivo. La página ya es privada para tu cuenta de Claude; el PIN agrega un bloqueo local.</p>`}
  </div></main>`;
  app.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>pinKey(b.dataset.k));
  const f=$("#forgot");if(f)f.onclick=()=>{L.forgot=true;drawLock()};
  const nf=$("#nf");if(nf)nf.onclick=()=>{L.forgot=false;drawLock()};
  const yf=$("#yf");if(yf)yf.onclick=()=>{put(PKEY,null);put(KEY,null);put(HKEY,null);stats={};hist=[];lockScreen()};
}
async function pinKey(k){
  const L=lockState;if(!L)return;
  if(k==="del"){L.buf=L.buf.slice(0,-1);L.err="";drawLock();return}
  if(L.buf.length>=4)return;
  L.buf+=k;L.err="";drawLock();
  if(L.buf.length<4)return;
  const pin=L.buf;
  if(L.stage==="create"){L.first=pin;L.buf="";L.stage="confirm";setTimeout(drawLock,120);return}
  if(L.stage==="confirm"){
    if(pin!==L.first){L.stage="create";L.first="";L.buf="";L.err="Los PIN no coinciden. Créalo de nuevo.";drawLock();return}
    put(PKEY,await hashPin(pin));unlock();return}
  if(await hashPin(pin)===get(PKEY)){unlock()}else{L.buf="";L.err="PIN incorrecto. Intenta de nuevo.";drawLock()}
}
function unlock(){lockState=null;setOpen(true);go("inicio")}
document.addEventListener("keydown",e=>{if(!lockState)return;if(/^[0-9]$/.test(e.key))pinKey(e.key);else if(e.key==="Backspace")pinKey("del")});

function mode(m){
  const sim=(pool,label)=>start(simSize==="Todas"?pool:pool.slice(0,simSize),"sim",label);
  if(m==="pjs")sim(shuffle(Q.filter(q=>q.p)),"Casos tipo examen");

  if(m==="general")sim(shuffle(QG),"Simulacro general");

  if(m==="errores")start(shuffle(Q.filter(q=>wrongIds().includes(q.id))),"prac","Repaso de errores");
}
function meter(acc){return acc==null?`<span class="meter"><i style="width:0"></i></span>`:`<span class="meter"><i class="${acc<CONFIG.minimo/100?"low":""}" style="width:${Math.round(acc*100)}%"></i></span>`}
function topicRows(names){
  return names.map(t=>{
    if(t===COMP)return `<button class="row" data-topic="${esc(t)}"><span class="t">${esc(t)}</span><span class="d">${Q.filter(q=>q.lk).length} afirmaciones · sin calificación</span><span class="r">${I.chev}</span></button>`;
    const s=topicStats(t);
    return `<button class="row" data-topic="${esc(t)}"><span class="t">${esc(t)}</span><span class="d">${s.seen}/${s.total} vistas${s.acc!=null?` · ${Math.round(s.acc*100)}% de aciertos`:""}</span><span class="r">${I.chev}</span>${meter(s.acc)}</button>`}).join("");
}
function totals(){const seen=QG.filter(q=>stats[q.id]);const n=seen.reduce((a,q)=>a+stats[q.id].n,0),ok=seen.reduce((a,q)=>a+stats[q.id].ok,0);return {seen:seen.length,n,ok,acc:n?ok/n:null}}

// ---------- examen ----------
function start(list,m,label){
  if(!list.length)return;
  const timed=list.filter(q=>!q.lk).length;
  S={list:list.map(q=>({q,order:q.lk?[0,1,2,3]:shuffle([0,1,2]),pick:null})),i:0,mode:m,label,end:m==="sim"?Date.now()+timed*90e3:null,confirm:false};
  clearInterval(timerId);if(m==="sim")timerId=setInterval(tick,1000);
  render();
}
function tick(){const el=$("#timer");if(!S||!S.end)return;const ms=S.end-Date.now();if(ms<=0){finish();return}
  if(el){const m=Math.floor(ms/6e4),s=Math.floor(ms/1e3)%60;el.textContent=`${m}:${String(s).padStart(2,"0")}`;el.classList.toggle("low",ms<12e4)}}
function feedback(it){
  const q=it.q,L="ABCD";
  if(q.lk)return `<div class="fb info"><strong>Sin respuesta correcta</strong><span>Competencia: ${esc(q.k)}.</span><span class="muted">Elige lo que de verdad haces normalmente. Si respondes casi todo con "Totalmente de acuerdo", las escalas de control pueden marcarlo como respuesta exageradamente favorable.</span></div>`;
  const ok=it.pick===q.a,key=`<span>Clave <b>${L[it.order.indexOf(q.a)]}</b> · ${esc(q.o[q.a])}</span>`;
  const why=q.j?`<span class="muted">${esc(q.j[q.a])}</span>${ok?"":`<span class="muted"><b style="color:var(--ink)">Tu opción ${L[it.order.indexOf(it.pick)]}:</b> ${esc(q.j[it.pick])}</span>`}`:`<span class="muted">${esc(q.e)}</span>`;
  return `<div class="fb ${ok?"ok":"bad"}"><strong>${ok?"Correcto":"Incorrecto"}</strong>${ok?"":key}${why}<span class="ref">${esc(q.r)}</span></div>`;
}
function render(){
  const it=S.list[S.i],q=it.q,n=S.list.length,sim=S.mode==="sim",answered=it.pick!==null;
  const L="ABCD",texts=q.lk?LK:q.o,lock=answered&&!sim&&!q.lk;
  const done=S.list.filter(x=>x.pick!==null).length;
  const opts=it.order.map((oi,k)=>{let c="opt";
    if(answered){if(sim||q.lk){if(it.pick===oi)c+=" sel"}else{if(oi===q.a)c+=" ok";else if(it.pick===oi)c+=" bad"}}
    return `<button class="${c}" data-oi="${oi}" ${lock?"disabled":""}><span class="l">${L[k]}</span><span>${esc(texts[oi])}</span></button>`}).join("");
  const head=q.cs?`<div class="caso"><span class="kicker">Caso</span><p>${esc(q.cs)}</p></div><span class="kicker">Enunciado</span>`:q.lk?`<span class="kicker">Afirmación · ${esc(q.k)}</span>`:"";
  const last=S.i===n-1;
  app.innerHTML=`
  <header class="qbar gut"><div class="inner">
    <button class="icon-btn" id="exit" aria-label="Salir">${I.x}</button>
    <div class="qmeta"><b>${esc(S.label)}</b><span class="mono">${S.i+1} de ${n}</span></div>
    ${sim?`<span class="timer" id="timer">--:--</span>`:"<span></span>"}
  </div></header>
  <div class="prog"><i style="width:${(sim?done:S.i+(answered?1:0))/n*100}%"></i></div>
  <main class="quiz gut"><div class="inner">
    <span class="kicker">${esc(q.t)}</span>
    ${head}
    <p class="qtext">${esc(q.q)}</p>
    <div class="opts">${opts}</div>
    ${answered&&!sim?feedback(it):""}
    ${sim?`<div class="stack" style="gap:10px"><span class="kicker">${done} de ${n} respondidas</span><div class="grid">${S.list.map((x,k)=>`<button data-go="${k}" class="${x.pick!==null?"done":""} ${k===S.i?"cur":""}" aria-label="Pregunta ${k+1}">${k+1}</button>`).join("")}</div></div>`:""}
    <div id="confirm"></div>
  </div></main>
  <footer class="qnav gut"><div class="inner">
    ${sim?`<button class="btn" id="prev" ${S.i?"":"disabled"}>Anterior</button>`:""}
    ${!last?`<button class="btn primary" id="next" ${!sim&&!answered?"disabled":""}>Siguiente</button>`:`<button class="btn primary" id="fin" ${!sim&&!answered?"disabled":""}>${sim?"Terminar y calificar":"Ver resultado"}</button>`}
  </div></footer>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(lock)return;const first=it.pick===null;it.pick=+b.dataset.oi;if(!sim&&first)record(q,it.pick===q.a);render()});
  $("#exit").onclick=()=>{$("#confirm").innerHTML=`<div class="confirm"><p>${sim?"¿Salir del simulacro? No se calificará.":"¿Salir? Tus respuestas ya quedaron guardadas."}</p><div class="acts"><button class="btn" id="no">Seguir</button><button class="btn danger" id="yes">Salir</button></div></div>`;
    $("#no").onclick=()=>$("#confirm").innerHTML="";$("#yes").onclick=()=>go(tab);$("#confirm").scrollIntoView({behavior:"smooth",block:"center"})};
  const nx=$("#next");if(nx)nx.onclick=()=>{S.i++;render();window.scrollTo(0,0)};
  const pv=$("#prev");if(pv)pv.onclick=()=>{S.i--;render();window.scrollTo(0,0)};
  const f=$("#fin");if(f)f.onclick=finish;
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{S.i=+b.dataset.go;render();window.scrollTo(0,0)});
  if(sim)tick();
}
function finish(){
  clearInterval(timerId);
  const sim=S.mode==="sim";
  if(sim)S.list.forEach(x=>{if(x.pick!==null)record(x.q,x.pick===x.q.a)});
  const graded=S.list.filter(x=>!x.q.lk),likert=S.list.filter(x=>x.q.lk&&x.pick!==null);
  const ok=graded.filter(x=>x.pick===x.q.a).length,n=graded.length,sc=score(ok,n);
  if(sim&&n){hist.unshift({d:Date.now(),l:S.label,s:sc,ok,n});hist=hist.slice(0,20);put(HKEY,hist)}
  const by=TOPICS.map(t=>{const xs=graded.filter(x=>x.q.t===t);return {t,n:xs.length,ok:xs.filter(x=>x.pick===x.q.a).length}}).filter(x=>x.n);
  const wrong=graded.filter(x=>x.pick!==x.q.a),top=likert.filter(x=>x.pick===3).length,label=S.label;
  const back=tab;
  app.innerHTML=`
  <header class="qbar gut"><div class="inner"><button class="icon-btn" id="close" aria-label="Cerrar">${I.x}</button><div class="qmeta"><b>Resultado</b><span>${esc(label)}</span></div><span></span></div></header>
  <div class="prog"><i style="width:100%"></i></div>
  <main class="quiz gut"><div class="inner" style="gap:28px">
    ${n?`<section class="hero"><div class="big">${fmt(sc)}<small>de 100</small></div><p>${ok} de ${n} correctas ${sc>=CONFIG.minimo?`<span class="pill ok">Supera el mínimo de ${fmt(CONFIG.minimo)}</span>`:`<span class="pill bad">Por debajo de ${fmt(CONFIG.minimo)}</span>`}</p></section>`
      :`<section class="hero"><h1>Listo</h1><p class="muted">Respondiste ${likert.length} ${likert.length===1?"afirmación":"afirmaciones"} y marcaste "Totalmente de acuerdo" en ${top}.${likert.length&&top/likert.length>0.8?" Es una proporción muy alta: en la prueba real, las escalas de control pueden leerla como respuesta exageradamente favorable.":""}</p></section>`}
    ${by.length>1?`<section class="stack"><h2>Por tema</h2><div class="list">${by.map(b=>`<div class="row"><span class="t">${esc(b.t)}</span><span class="d">${b.ok} de ${b.n}</span><span class="r mono">${Math.round(b.ok/b.n*100)}%</span>${meter(b.ok/b.n)}</div>`).join("")}</div></section>`:""}
    ${wrong.length?`<section class="stack"><h2>Para repasar · ${wrong.length}</h2><div class="list">${wrong.map(x=>`<div class="rv"><span class="kicker">${esc(x.q.t)}</span>${x.q.cs?`<span class="muted">${esc(x.q.cs)}</span>`:""}<b style="font-weight:500">${esc(x.q.q)}</b>${x.pick!==null?`<span class="yours">Tu respuesta: ${esc(x.q.o[x.pick])}</span>`:`<span class="yours">Sin responder · cuenta como omisión</span>`}<span class="right">Correcta: ${esc(x.q.o[x.q.a])}</span><span class="muted">${esc(x.q.j?x.q.j[x.q.a]:x.q.e)}</span><span class="ref">${esc(x.q.r)}</span></div>`).join("")}</div></section>`:""}
  </div></main>
  <footer class="qnav gut"><div class="inner">
    <button class="btn" id="back">Volver</button>
    ${wrong.length?`<button class="btn primary" id="again">Practicar las ${wrong.length} falladas</button>`:""}
  </div></footer>`;
  const a=$("#again");if(a)a.onclick=()=>start(shuffle(wrong.map(x=>x.q)),"prac","Repaso de errores");
  $("#back").onclick=()=>go(back);$("#close").onclick=()=>go(back);
  S=null;window.scrollTo(0,0);
}

// ---------- arranque ----------
if(!storageOK()){go("inicio")}
else if(isOpen()&&get(PKEY)){go("inicio")}
else{lockScreen()}
</script>
