<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Simulador de práctica para la prueba escrita del concurso DIAN 2676 (CNSC). Herramienta de estudio independiente.">
<meta name="theme-color" content="#F6F6F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D0F12" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Simulacro 2676">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Simulacro DIAN 2676</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: app de una columna (máx. 680px) con barra superior, contenido y barra de pestañas inferior fija; las vistas de examen ocupan la pantalla sin pestañas */
:root{
  --bg:#F6F6F4; --surface:#FFFFFF; --soft:#EFEFEB; --ink:#15171B; --muted:#6A6F77; --line:#E3E3DE;
  --accent:#0E6B58; --on-accent:#FFFFFF; --accent-soft:#E2EFEA;
  --ok:#157A43; --ok-soft:#E5F3EA; --bad:#B42318; --bad-soft:#FBEAE8;
  --sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D0F12; --surface:#15181C; --soft:#1B1F24; --ink:#ECEDEF; --muted:#8E949C; --line:#252A30;
  --accent:#4FC2A4; --on-accent:#06231C; --accent-soft:#11302A;
  --ok:#4ADE80; --ok-soft:#0F2A1B; --bad:#F68B80; --bad-soft:#331715; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D0F12; --surface:#15181C; --soft:#1B1F24; --ink:#ECEDEF; --muted:#8E949C; --line:#252A30;
  --accent:#4FC2A4; --on-accent:#06231C; --accent-soft:#11302A;
  --ok:#4ADE80; --ok-soft:#0F2A1B; --bad:#F68B80; --bad-soft:#331715; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,p{margin:0}
h1{font-size:1.75rem;font-weight:600;letter-spacing:-.025em;line-height:1.15;text-wrap:balance}
h2{font-size:.78rem;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:680px;margin:0 auto}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}

/* barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.top .inner{display:flex;align-items:center;justify-content:space-between;height:56px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.01em}
.mark{width:28px;height:28px;border-radius:8px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--mono);font-size:.72rem;font-weight:500}
.top-r{display:flex;align-items:center;gap:6px}
.chip{font-family:var(--mono);font-size:.75rem;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;color:var(--muted)}
.icon-btn:hover{background:var(--soft);color:var(--ink)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* contenido */
.view{padding-block:24px calc(96px + env(safe-area-inset-bottom,0px))}
.view .inner{display:flex;flex-direction:column;gap:28px}
.stack{display:flex;flex-direction:column;gap:12px}

/* pestañas inferiores */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .inner{display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 8px;font-size:.7rem;font-weight:500;color:var(--muted)}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] svg.i{stroke-width:2.1}

/* inicio */
.hero{display:flex;flex-direction:column;gap:6px}
.big{font-size:3.6rem;font-weight:600;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:1.1rem;font-weight:500;letter-spacing:-.01em;color:var(--muted);margin-left:6px}
.cta{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;text-align:left;padding:18px 20px;border-radius:var(--r);background:var(--ink);color:var(--bg)}
.cta b{display:block;font-weight:600;font-size:1.02rem}
.cta span.s{display:block;font-size:.84rem;opacity:.7}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi+.kpi{border-left:1px solid var(--line)}
.kpi b{font-size:1.35rem;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi span{font-size:.75rem;color:var(--muted)}

/* listas */
.list{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 14px;width:100%;text-align:left;padding:14px 16px;min-height:56px}
.row+.row{border-top:1px solid var(--line)}
button.row:hover{background:var(--soft)}
.row .t{font-weight:500;min-width:0}
.row .d{font-size:.8rem;color:var(--muted);grid-column:1}
.row .r{grid-row:1/span 2;grid-column:2;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.8rem}
.row .meter{grid-column:1/-1;height:3px;border-radius:3px;background:var(--soft);overflow:hidden;margin-top:6px}
.row .meter i{display:block;height:100%;background:var(--accent)}
.row .meter i.low{background:var(--bad)}
.badge{font-size:.68rem;font-weight:600;letter-spacing:.03em;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:12px;background:var(--soft)}
.seg button{padding:8px;border-radius:9px;font-size:.85rem;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.label{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.empty{padding:16px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);font-size:.9rem}
.note{font-size:.82rem;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;font-weight:500;border:1px solid var(--line);background:var(--surface);min-height:46px}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.link{color:var(--muted);font-size:.85rem;text-decoration:underline;text-underline-offset:3px;padding:8px 0}
.confirm{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:var(--r);background:var(--bad-soft)}
.confirm .acts{display:flex;gap:8px}

/* guía */
.guide details{border-top:1px solid var(--line)}
.guide details:last-child{border-bottom:1px solid var(--line)}
.guide summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:16px 0;font-weight:500;cursor:pointer}
.guide summary::-webkit-details-marker{display:none}
.guide summary::after{content:"+";font-family:var(--mono);color:var(--muted);font-size:1.1rem}
.guide details[open] summary::after{content:"−"}
.guide ul{margin:0 0 16px;padding-left:18px;display:flex;flex-direction:column;gap:8px;color:var(--ink);font-size:.92rem}
.guide li::marker{color:var(--muted)}

/* bloqueo */
.lock{min-height:100%;display:flex;align-items:center;justify-content:center;padding-block:40px}
.lockbox{width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center;gap:28px;text-align:center}
.lockbox .mark{width:48px;height:48px;border-radius:14px;font-size:1rem}
.lockbox h1{font-size:1.5rem}
.dots{display:flex;gap:14px;height:14px}
.dots i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--muted)}
.dots i.on{background:var(--ink);border-color:var(--ink)}
.dots.err{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.err-msg{color:var(--bad);font-size:.85rem;min-height:1.3em}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px 22px}
.pad button{width:72px;height:72px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-size:1.5rem;font-weight:400;font-variant-numeric:tabular-nums}
.pad button:active{background:var(--soft)}
.pad button.ghost{background:none;border-color:transparent;color:var(--muted)}

/* examen */
.qbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.qbar .inner{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:8px;height:56px}
.qmeta{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.qmeta b{font-weight:500;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qmeta span{font-size:.75rem;color:var(--muted)}
.timer{font-family:var(--mono);font-size:.85rem;padding:4px 10px;border-radius:999px;background:var(--soft);font-variant-numeric:tabular-nums}
.timer.low{background:var(--bad-soft);color:var(--bad)}
.prog{height:2px;background:var(--line)}
.prog i{display:block;height:100%;background:var(--ink);transition:width .25s ease}
.quiz{padding-block:20px calc(110px + env(safe-area-inset-bottom,0px))}
.quiz .inner{display:flex;flex-direction:column;gap:18px}
.kicker{font-size:.72rem;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.caso{padding:14px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.qtext{font-size:1.15rem;font-weight:500;letter-spacing:-.01em;line-height:1.45}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);transition:border-color .15s,background .15s}
.opt .l{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-family:var(--mono);font-size:.8rem;background:var(--soft);color:var(--muted)}
.opt:hover:not([disabled]){border-color:var(--muted)}
.opt.sel{border-color:var(--ink)} .opt.sel .l{background:var(--ink);color:var(--bg)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)} .opt.ok .l{background:var(--ok);color:var(--surface)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)} .opt.bad .l{background:var(--bad);color:var(--surface)}
.opt[disabled]{cursor:default}
.fb{display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:12px;font-size:.92rem;border-left:3px solid var(--muted);background:var(--surface)}
.fb.ok{border-left-color:var(--ok)} .fb.bad{border-left-color:var(--bad)} .fb.info{border-left-color:var(--accent)}
.fb strong{font-weight:600}
.ref{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.qnav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px))}
.qnav .inner{display:flex;gap:10px}
.qnav .btn{flex:1}
.grid{display:flex;flex-wrap:wrap;gap:6px}
.grid button{width:34px;height:34px;border-radius:9px;font-family:var(--mono);font-size:.75rem;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.grid button.done{background:var(--soft);color:var(--ink)}
.grid button.cur{border-color:var(--ink);color:var(--ink)}

/* resultados */
.pill{display:inline-flex;font-size:.75rem;font-weight:500;padding:3px 10px;border-radius:999px}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.rv{padding:16px;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.rv+.rv{border-top:1px solid var(--line)}
.rv .yours{color:var(--bad)} .rv .right{color:var(--ok);font-weight:500}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>

<script>
const EXAM = new Date(2026, 10, 8); // domingo 8 de noviembre de 2026
const COMP = "Comportamental e integridad";
// Banco original de práctica. a = índice de la opción correcta (antes de barajar).
const Q = [
// Constitución y Estado
{t:"Constitución y Estado",q:"Según la Constitución, en tiempo de paz ¿quiénes pueden imponer contribuciones fiscales o parafiscales?",o:["Solo el Congreso, las asambleas departamentales y los concejos distritales y municipales","El Presidente mediante decreto ordinario y la DIAN mediante resolución","El Ministerio de Hacienda y las gobernaciones"],a:0,e:"Principio de legalidad tributaria. La DIAN administra los tributos, pero no los crea.",r:"Const. art. 338"},
{t:"Constitución y Estado",q:"El sistema tributario colombiano se funda en los principios de:",o:["Equidad, eficiencia y progresividad","Legalidad, publicidad y celeridad","Solidaridad, subsidiariedad y concurrencia"],a:0,e:"El mismo artículo agrega que las leyes tributarias no se aplican con retroactividad.",r:"Const. art. 363"},
{t:"Constitución y Estado",q:"Una ley que modifica un impuesto de período anual se publica en junio. ¿Desde cuándo se aplica?",o:["Desde el período que comience después de iniciar su vigencia","Desde el día siguiente a su publicación","Desde el 1 de enero del mismo año de publicación"],a:0,e:"Para tributos de período, la ley solo aplica desde el período siguiente a su vigencia.",r:"Const. art. 338, inc. final"},
{t:"Constitución y Estado",q:"El deber de contribuir al financiamiento de los gastos e inversiones del Estado, dentro de conceptos de justicia y equidad, está en:",o:["El artículo 95, numeral 9, de la Constitución","El artículo 23 de la Constitución","El artículo 86 de la Constitución"],a:0,e:"El art. 23 es el derecho de petición y el art. 86 la acción de tutela.",r:"Const. art. 95-9"},
{t:"Constitución y Estado",q:"¿Cuál es el plazo máximo entre la solicitud de tutela y su resolución?",o:["10 días","15 días hábiles","30 días"],a:0,e:"En ningún caso pueden pasar más de diez días entre la solicitud y la decisión.",r:"Const. art. 86"},
{t:"Constitución y Estado",q:"Son principios de la función administrativa:",o:["Igualdad, moralidad, eficacia, economía, celeridad, imparcialidad y publicidad","Equidad, eficiencia, progresividad y no retroactividad","Legalidad, tipicidad, culpabilidad y proporcionalidad"],a:0,e:"La segunda opción son los principios del sistema tributario (art. 363); la tercera, principios del derecho sancionatorio.",r:"Const. art. 209"},
{t:"Constitución y Estado",q:"El sistema específico de carrera de los empleados de la DIAN está regulado principalmente por:",o:["El Decreto Ley 071 de 2020","La Ley 909 de 2004, sin excepciones","El Decreto 1165 de 2019"],a:0,e:"La Ley 909 aplica solo de forma supletiva. El Decreto 1165 es el régimen de aduanas.",r:"D.L. 071/2020"},
// Peticiones y CPACA
{t:"Peticiones y CPACA",q:"Un ciudadano radica una petición general (no es consulta ni pide documentos). ¿En qué término se responde?",o:["15 días siguientes a su recepción","10 días siguientes a su recepción","30 días siguientes a su recepción"],a:0,e:"Regla general: 15 días. Documentos e información: 10 días. Consultas: 30 días.",r:"Ley 1755/2015 art. 14"},
{t:"Peticiones y CPACA",q:"Una persona pide copia de documentos que no tienen reserva. ¿En qué término se resuelve?",o:["10 días siguientes a su recepción","15 días siguientes a su recepción","5 días siguientes a su recepción"],a:0,e:"Si no se responde en ese término, se entiende aceptada y la copia debe entregarse dentro de los 3 días siguientes.",r:"Ley 1755/2015 art. 14-1"},
{t:"Peticiones y CPACA",q:"Una consulta a la autoridad sobre materias a su cargo debe resolverse en:",o:["30 días siguientes a su recepción","15 días siguientes a su recepción","2 meses"],a:0,e:"Las consultas tienen el término más largo de los tres.",r:"Ley 1755/2015 art. 14-2"},
{t:"Peticiones y CPACA",q:"Si no es posible responder una petición dentro del plazo legal, la autoridad debe:",o:["Informar antes del vencimiento los motivos y el nuevo plazo, que no puede exceder el doble del inicial","Archivar la petición y pedir que se radique de nuevo","Responder cuando sea posible, sin necesidad de avisar"],a:0,e:"Así lo exige el parágrafo del artículo 14.",r:"Ley 1755/2015 art. 14 par."},
{t:"Peticiones y CPACA",q:"Pasados tres meses desde una petición sin que se notifique decisión, por regla general se entiende que:",o:["La petición fue negada (silencio administrativo negativo)","La petición fue concedida (silencio positivo)","La petición caducó"],a:0,e:"El silencio positivo solo opera cuando la ley lo dice expresamente.",r:"CPACA art. 83"},
{t:"Peticiones y CPACA",q:"Contra un acto administrativo particular regido por el CPACA, los recursos de reposición y apelación se presentan dentro de:",o:["Los 10 días siguientes a la notificación","Los 2 meses siguientes a la notificación","El año siguiente a la notificación"],a:0,e:"Ojo: en materia tributaria el recurso es el de reconsideración, con 2 meses (art. 720 ET).",r:"CPACA art. 76"},
{t:"Peticiones y CPACA",q:"La reserva de la información contenida en las declaraciones tributarias está establecida en:",o:["El artículo 583 del Estatuto Tributario","El artículo 23 de la Constitución","La Ley 1712 de 2014, que obliga a publicarla"],a:0,e:"Los funcionarios solo pueden usar esa información para control, recaudo, determinación, discusión y administración de impuestos, y para estadísticas.",r:"ET art. 583"},
{t:"Peticiones y CPACA",q:"La ley de transparencia y del derecho de acceso a la información pública nacional es:",o:["Ley 1712 de 2014","Ley 1581 de 2012","Ley 87 de 1993"],a:0,e:"La Ley 1581 es protección de datos personales y la Ley 87 es control interno.",r:"Ley 1712/2014"},
{t:"Peticiones y CPACA",q:"Un ciudadano quiere presentar una petición de forma verbal en un punto de atención. Lo correcto es:",o:["Recibirla, porque las peticiones pueden presentarse verbalmente, y dejar constancia","Exigirle que la presente por escrito","Indicarle que solo se reciben por la página web"],a:0,e:"Las peticiones pueden ser verbales, escritas o por cualquier medio idóneo.",r:"Ley 1755/2015 art. 15"},
// Procedimiento tributario
{t:"Fiscalización y liquidación tributaria y aduanera",q:"Por regla general, una declaración tributaria queda en firme si no se notifica requerimiento especial dentro de:",o:["Los 3 años siguientes al vencimiento del plazo para declarar","Los 5 años siguientes a su presentación","Los 2 años siguientes al vencimiento del plazo"],a:0,e:"Si se presentó tarde, los 3 años corren desde la presentación. Hay términos especiales, por ejemplo cuando hay pérdidas fiscales.",r:"ET art. 714"},
{t:"Fiscalización y liquidación tributaria y aduanera",q:"¿Cuánto tiempo tiene el contribuyente para responder el requerimiento especial?",o:["3 meses desde su notificación","1 mes desde su notificación","15 días hábiles"],a:0,e:"En la respuesta puede presentar pruebas y aceptar total o parcialmente lo propuesto.",r:"ET art. 707"},
{t:"Fiscalización y liquidación tributaria y aduanera",q:"Vencido el término para responder el requerimiento especial, la DIAN tiene para notificar la liquidación oficial de revisión:",o:["6 meses","1 año","3 meses"],a:0,e:"Si se practica inspección tributaria, el término se suspende.",r:"ET art. 710"},
{t:"Fiscalización y liquidación tributaria y aduanera",q:"El recurso de reconsideración contra una liquidación oficial se interpone dentro de:",o:["Los 2 meses siguientes a la notificación","Los 10 días siguientes a la notificación","Los 3 meses siguientes a la notificación"],a:0,e:"Es el recurso propio del procedimiento tributario.",r:"ET art. 720"},
{t:"Fiscalización y liquidación tributaria y aduanera",q:"¿Cuánto tiempo tiene la DIAN para resolver el recurso de reconsideración, desde su interposición en debida forma?",o:["1 año","6 meses","2 años"],a:0,e:"Si no lo resuelve a tiempo, opera el silencio administrativo positivo (art. 734).",r:"ET art. 732"},
{t:"Fiscalización y liquidación tributaria y aduanera",q:"Si vence el plazo para resolver el recurso de reconsideración sin decisión notificada:",o:["Se entiende fallado a favor del recurrente (silencio positivo)","Se entiende negado (silencio negativo)","El recurso caduca y el acto queda en firme"],a:0,e:"Es una excepción a la regla general del silencio negativo.",r:"ET art. 734"},
{t:"Fiscalización y liquidación tributaria y aduanera",q:"Un obligado a declarar es emplazado por la DIAN. ¿Qué plazo tiene para presentar la declaración?",o:["1 mes","15 días","3 meses"],a:0,e:"Si declara en ese plazo, la sanción por extemporaneidad es la del art. 642.",r:"ET art. 715"},
{t:"Fiscalización y liquidación tributaria y aduanera",q:"La sanción por extemporaneidad antes del emplazamiento, cuando hay impuesto a cargo, es:",o:["5% por cada mes o fracción de retardo, sin exceder el 100% del impuesto","10% por cada mes o fracción, sin exceder el 200%","1% por cada día de retardo"],a:0,e:"La segunda opción corresponde a la extemporaneidad después del emplazamiento (art. 642).",r:"ET art. 641"},
{t:"Fiscalización y liquidación tributaria y aduanera",q:"Ninguna sanción tributaria puede ser inferior a:",o:["10 UVT","1 salario mínimo","100 UVT"],a:0,e:"Es la sanción mínima.",r:"ET art. 639"},
{t:"Fiscalización y liquidación tributaria y aduanera",q:"¿Cuál situación hace que una declaración se tenga por no presentada?",o:["No tiene la firma de quien debe cumplir el deber formal de declarar","Tiene un error aritmético en una suma","Se presentó un día después del vencimiento"],a:0,e:"Los errores aritméticos se corrigen (art. 697) y la presentación tardía genera sanción, pero la declaración sí existe.",r:"ET art. 580"},
{t:"Fiscalización y liquidación tributaria y aduanera",q:"Una declaración tiene un error aritmético que generó un menor valor a pagar. ¿Qué acto procede?",o:["Liquidación oficial de corrección aritmética","Liquidación oficial de revisión sin requerimiento especial","Declararla como no presentada"],a:0,e:"La corrección aritmética no necesita requerimiento especial previo.",r:"ET art. 697"},
{t:"Fiscalización y liquidación tributaria y aduanera",q:"La acción de cobro de las obligaciones fiscales prescribe en:",o:["5 años","3 años","10 años"],a:0,e:"Se cuenta, entre otros casos, desde el vencimiento del plazo para declarar.",r:"ET art. 817"},
{t:"Fiscalización y liquidación tributaria y aduanera",q:"El mecanismo único para identificar, ubicar y clasificar a los sujetos de obligaciones administradas por la DIAN es:",o:["El Registro Único Tributario (RUT)","El NIT por sí solo","La factura electrónica"],a:0,e:"El NIT es el número que identifica al contribuyente; el RUT es el registro completo.",r:"ET art. 555-2"},
{t:"Fiscalización y liquidación tributaria y aduanera",q:"La tasa de interés moratorio tributario equivale a:",o:["La tasa de usura vigente para créditos de consumo menos 2 puntos","La DTF más 5 puntos","Una tasa fija del 12% anual"],a:0,e:"La certifica la Superintendencia Financiera.",r:"ET art. 635"},
{t:"Fiscalización y liquidación tributaria y aduanera",q:"La retención en la fuente es, en esencia:",o:["Un mecanismo de recaudo anticipado del impuesto","Un impuesto adicional e independiente","Una sanción por pago tardío"],a:0,e:"Busca que el impuesto se recaude, en lo posible, en el mismo año en que se causa.",r:"ET art. 365 y 367"},
// Renta
{t:"Liquidación de impuestos nacionales",q:"La tarifa general del impuesto de renta para personas jurídicas nacionales es:",o:["35%","33%","30%"],a:0,e:"Tarifa vigente desde la Ley 2277 de 2022.",r:"ET art. 240"},
{t:"Liquidación de impuestos nacionales",q:"Las rentas de las personas naturales residentes se depuran en las cédulas:",o:["General, de pensiones y de dividendos y participaciones","Laboral, de capital y no laboral únicamente","Ordinaria, extraordinaria y ocasional"],a:0,e:"Desde la Ley 2277, la cédula general agrupa rentas de trabajo, de capital y no laborales. Las ganancias ocasionales van aparte.",r:"ET art. 330"},
{t:"Liquidación de impuestos nacionales",q:"La tarifa general del impuesto de ganancia ocasional es:",o:["15%","10%","20%"],a:0,e:"Subió del 10% al 15% con la Ley 2277 de 2022. Loterías, rifas y apuestas tienen el 20%.",r:"ET art. 313 y 317"},
{t:"Liquidación de impuestos nacionales",q:"Ingresos ordinarios y extraordinarios, menos devoluciones, rebajas y descuentos, da como resultado:",o:["Ingresos netos","Renta bruta","Renta líquida gravable"],a:0,e:"Ingresos netos − costos = renta bruta; renta bruta − deducciones = renta líquida.",r:"ET art. 26"},
{t:"Liquidación de impuestos nacionales",q:"Pueden optar por el Régimen Simple de Tributación quienes, entre otros requisitos, en el año anterior tuvieron ingresos brutos:",o:["Inferiores a 100.000 UVT","Inferiores a 3.500 UVT","Superiores a 100.000 UVT"],a:0,e:"Es uno de los requisitos del régimen SIMPLE.",r:"ET art. 905"},
// IVA y otros
{t:"Liquidación de impuestos nacionales",q:"La tarifa general del IVA es:",o:["19%","16%","5%"],a:0,e:"El 5% es una tarifa diferencial para ciertos bienes y servicios.",r:"ET art. 468"},
{t:"Liquidación de impuestos nacionales",q:"¿Cuál NO es un hecho generador del IVA?",o:["El pago de salarios a trabajadores","La importación de bienes corporales no excluidos","La prestación de servicios en el territorio nacional"],a:0,e:"Hechos generadores: venta de bienes, prestación de servicios, importación y juegos de suerte y azar (salvo loterías).",r:"ET art. 420"},
{t:"Liquidación de impuestos nacionales",q:"¿Cuál es la diferencia entre bienes exentos y excluidos del IVA?",o:["Los exentos están gravados a tarifa 0% y dan derecho a devolución; los excluidos no causan IVA","Los excluidos tienen tarifa 0% con devolución; los exentos no causan IVA","No hay diferencia práctica"],a:0,e:"El productor de bienes exentos es responsable y puede pedir devolución del IVA pagado en sus compras.",r:"ET art. 424 y 477"},
{t:"Liquidación de impuestos nacionales",q:"Declaran IVA de forma bimestral:",o:["Grandes contribuyentes y personas con ingresos brutos del año anterior iguales o superiores a 92.000 UVT","Todos los responsables sin excepción","Solo los importadores"],a:0,e:"Los demás responsables declaran cuatrimestralmente.",r:"ET art. 600"},
{t:"Liquidación de impuestos nacionales",q:"La tarifa del Gravamen a los Movimientos Financieros (GMF) es:",o:["4 por mil","1 por mil","4%"],a:0,e:"Conocido como el 4×1000.",r:"ET art. 872"},
// Aduanas
{t:"Fiscalización y liquidación tributaria y aduanera",q:"La norma que contiene el régimen general de aduanas en Colombia es:",o:["El Decreto 1165 de 2019","El Decreto 624 de 1989","La Ley 1755 de 2015"],a:0,e:"El Decreto 624 de 1989 es el Estatuto Tributario.",r:"Dcto. 1165/2019"},
{t:"Fiscalización y liquidación tributaria y aduanera",q:"El acto por el cual la autoridad aduanera permite a los declarantes disponer de la mercancía, tras cumplir los requisitos, es:",o:["El levante","El aforo","El abandono"],a:0,e:"El aforo es la verificación; el levante es la autorización para disponer.",r:"Dcto. 1165/2019 art. 3"},
{t:"Fiscalización y liquidación tributaria y aduanera",q:"El aforo consiste en:",o:["Verificar en forma documental o física la naturaleza, cantidad, valor y clasificación de la mercancía","Autorizar la libre disposición de la mercancía","Pagar los tributos aduaneros"],a:0,e:"Puede ser documental o físico, según el sistema de gestión del riesgo.",r:"Dcto. 1165/2019 art. 3"},
{t:"Fiscalización y liquidación tributaria y aduanera",q:"El primer método de valoración aduanera según el Acuerdo de Valor de la OMC es:",o:["El valor de transacción de las mercancías importadas","El valor deductivo","El valor reconstruido"],a:0,e:"Los métodos se aplican en orden; el de transacción es el principal.",r:"Acuerdo de Valor OMC art. 1"},
{t:"Fiscalización y liquidación tributaria y aduanera",q:"La nomenclatura arancelaria que aplica Colombia, basada en el Sistema Armonizado, es:",o:["NANDINA","NIIF","CIIU"],a:0,e:"La CIIU clasifica actividades económicas (se usa en el RUT); las NIIF son normas contables.",r:"Arancel de Aduanas"},
{t:"Fiscalización y liquidación tributaria y aduanera",q:"El régimen sancionatorio y de decomiso de mercancías en materia aduanera está reglamentado hoy en:",o:["El Decreto 920 de 2023","La Ley 1952 de 2019","El Decreto 2245 de 2011"],a:0,e:"La Ley 1952 es el Código Disciplinario y el Decreto 2245 es el régimen sancionatorio cambiario.",r:"Dcto. 920/2023"},
{t:"Fiscalización y liquidación tributaria y aduanera",q:"El contrabando es delito (Código Penal) cuando las mercancías superan un valor de:",o:["50 salarios mínimos legales mensuales vigentes","10 UVT","1.000 salarios mínimos"],a:0,e:"Por debajo de ese valor la conducta se trata en el régimen administrativo aduanero.",r:"C. Penal art. 319"},
{t:"Fiscalización y liquidación tributaria y aduanera",q:"El Operador Económico Autorizado (OEA) es:",o:["Una certificación para operadores que cumplen estándares de seguridad en la cadena de suministro, con beneficios de facilitación","Una agencia de aduanas obligatoria para toda importación","Un funcionario de la DIAN que autoriza el levante"],a:0,e:"Es voluntario y otorga beneficios como menos inspecciones.",r:"Dcto. 3568/2011"},
{t:"Fiscalización y liquidación tributaria y aduanera",q:"En un control encuentra mercancía sin documentos que acrediten su legal introducción al país. ¿Qué medida procede?",o:["La aprehensión de la mercancía","El levante de la mercancía","Una liquidación oficial de revisión"],a:0,e:"La aprehensión es la medida cautelar; luego sigue el proceso de definición de situación jurídica (decomiso).",r:"Dcto. 920/2023"},
// Cambiario
{t:"Normativa cambiaria",q:"La autoridad que expide la regulación cambiaria en Colombia es:",o:["La Junta Directiva del Banco de la República","La DIAN","La Superintendencia de Sociedades"],a:0,e:"La DIAN vigila y sanciona en los temas cambiarios de su competencia, como importaciones y exportaciones.",r:"Ley 31/1992"},
{t:"Normativa cambiaria",q:"El régimen sancionatorio cambiario a cargo de la DIAN está en:",o:["El Decreto 2245 de 2011","El Decreto 920 de 2023","La Ley 1474 de 2011"],a:0,e:"El Decreto 920 es aduanero y la Ley 1474 es el Estatuto Anticorrupción.",r:"Dcto. 2245/2011"},
// Disciplinario e integridad
{t:"Disciplinario y ética",q:"El Código General Disciplinario vigente es:",o:["La Ley 1952 de 2019, modificada por la Ley 2094 de 2021","La Ley 734 de 2002","La Ley 1474 de 2011"],a:0,e:"La Ley 734 fue derogada por la Ley 1952.",r:"Ley 1952/2019"},
{t:"Disciplinario y ética",q:"Según el Código General Disciplinario, las faltas se clasifican en:",o:["Gravísimas, graves y leves","Penales, civiles y fiscales","Dolosas y culposas únicamente"],a:0,e:"Dolo y culpa son formas de culpabilidad, no la clasificación de las faltas.",r:"Ley 1952/2019"},
{t:"Disciplinario y ética",q:"Los valores del Código de Integridad del Servicio Público son:",o:["Honestidad, respeto, compromiso, diligencia y justicia","Eficiencia, eficacia, efectividad, economía y equidad","Lealtad, obediencia, discreción, puntualidad y orden"],a:0,e:"Los adoptó Función Pública para todas las entidades.",r:"Código de Integridad"},
{t:"Disciplinario y ética",q:"La Ley 1474 de 2011 se conoce como:",o:["Estatuto Anticorrupción","Código de Procedimiento Administrativo","Ley de Habeas Data"],a:0,e:"El CPACA es la Ley 1437 de 2011 y Habeas Data es la Ley 1581 de 2012.",r:"Ley 1474/2011"},
{t:"Disciplinario y ética",q:"Le asignan el expediente de una empresa de la que su hermano es socio. Lo correcto es:",o:["Declararse impedido y comunicarlo a su superior antes de actuar","Revisarlo con especial cuidado para evitar sospechas","Pedirle a su hermano que no comente el tema"],a:0,e:"El parentesco es causal de impedimento por conflicto de interés.",r:"CPACA art. 11"},
{t:"Disciplinario y ética",q:"Durante una revisión, el contribuyente le ofrece un regalo para agilizar su trámite. Usted:",o:["Lo rechaza, sigue el trámite en los términos normales y reporta el ofrecimiento por los canales establecidos","Lo acepta si es de poco valor y no cambia la decisión","Lo rechaza y archiva el trámite como sanción"],a:0,e:"Archivar el trámite como castigo también sería una actuación indebida.",r:"Ley 1952/2019; Ley 1474/2011"},
{t:"Disciplinario y ética",q:"Un ciudadano le pide los ingresos que declaró su vecino porque sospecha que evade impuestos. Usted:",o:["Le explica que la información es reservada y le indica cómo presentar una denuncia","Le muestra solo el total de ingresos, sin detalles","Se la entrega porque actúa en interés público"],a:0,e:"La reserva tributaria se mantiene; la denuncia permite que la DIAN investigue.",r:"ET art. 583"},
// Gestión pública y DIAN
{t:"Estructura organizacional de la DIAN",q:"Por su naturaleza jurídica, la DIAN es:",o:["Una Unidad Administrativa Especial adscrita al Ministerio de Hacienda y Crédito Público","Un establecimiento público del orden departamental","Una superintendencia adscrita a la Presidencia"],a:0,e:"Tiene personería jurídica y autonomía administrativa y presupuestal.",r:"Dcto. 1742/2020"},
{t:"Gestión pública y DIAN",q:"El Modelo Integrado de Planeación y Gestión (MIPG) fue adoptado por:",o:["El Decreto 1499 de 2017","La Ley 1712 de 2014","El Decreto 1165 de 2019"],a:0,e:"El Decreto 1499 modificó el Decreto 1083 de 2015.",r:"Dcto. 1499/2017"},
{t:"Gestión pública y DIAN",q:"¿Cuál de estas es una dimensión del MIPG?",o:["Talento humano","Fiscalización aduanera","Cobro coactivo"],a:0,e:"Las 7 dimensiones: talento humano; direccionamiento estratégico; gestión con valores para resultados; evaluación de resultados; información y comunicación; gestión del conocimiento; control interno.",r:"MIPG"},
{t:"Gestión pública y DIAN",q:"La ley que establece normas para el control interno en las entidades del Estado es:",o:["Ley 87 de 1993","Ley 909 de 2004","Ley 1581 de 2012"],a:0,e:"La Ley 909 es empleo público y carrera administrativa.",r:"Ley 87/1993"},
// Comportamental e integridad (orientativo)
// Comportamental e integridad: autoinforme Likert de 4 niveles, sin respuesta correcta (GOA 4.5)
{t:COMP,lk:1,k:"Comportamiento ético",q:"Informo a mi jefe un error que cometí en un acta, aunque nadie más lo haya notado."},
{t:COMP,lk:1,k:"Comunicación efectiva",q:"Explico los requerimientos a los contribuyentes con palabras sencillas, aunque la atención me tome más tiempo."},
{t:COMP,lk:1,k:"Adaptabilidad",q:"Aprendo a usar los nuevos aplicativos de la entidad practicando por mi cuenta fuera de las tareas urgentes."},
{t:COMP,lk:1,k:"Trabajo en equipo",q:"Apoyo las tareas de mis compañeros cuando termino las mías antes del plazo."},
{t:COMP,lk:1,k:"Orientación al logro",q:"Reviso dos veces un inventario antes de entregarlo, aunque el plazo de entrega esté cerca."},
// ===== Cargo: Analista II 202-02 · Fiscalización y liquidación (c:1) =====
// Evasión, elusión y contrabando
{c:1,t:"Evasión, elusión y contrabando",q:"La evasión tributaria se caracteriza por:",o:["Incumplir total o parcialmente la obligación tributaria con conductas ilegales, como ocultar ingresos","Usar figuras legales de forma artificiosa para reducir impuestos sin violar la letra de la norma","Acogerse a beneficios tributarios previstos en la ley"],a:0,e:"La segunda opción describe la elusión (abuso tributario). La tercera es planeación tributaria legítima.",r:"Conceptos básicos"},
{c:1,t:"Evasión, elusión y contrabando",q:"Una empresa hace operaciones sin propósito económico real, solo para obtener un beneficio tributario. La DIAN puede recaracterizarlas porque se configura:",o:["Abuso en materia tributaria","Contrabando técnico","Omisión de activos"],a:0,e:"El abuso tributario es la figura legal que combate la elusión.",r:"ET art. 869"},
{c:1,t:"Evasión, elusión y contrabando",q:"Importar mercancía declarando un valor inferior al real para pagar menos tributos aduaneros se conoce como:",o:["Contrabando técnico (fraude aduanero)","Contrabando abierto","Elusión legítima"],a:0,e:"En el contrabando técnico la mercancía sí se presenta a la aduana, pero con información falsa (valor, cantidad, clasificación u origen).",r:"C. Penal art. 321"},
{c:1,t:"Evasión, elusión y contrabando",q:"Introducir mercancías por un lugar no habilitado, sin presentarlas ni declararlas ante la aduana, se conoce como:",o:["Contrabando abierto","Contrabando técnico","Subfacturación"],a:0,e:"Elude por completo el control aduanero.",r:"C. Penal art. 319"},
{c:1,t:"Evasión, elusión y contrabando",q:"Omitir activos o incluir pasivos inexistentes en la declaración de renta, por montos significativos, puede constituir el delito de:",o:["Omisión de activos o inclusión de pasivos inexistentes","Contrabando","Peculado por apropiación"],a:0,e:"Es un delito tributario autónomo. El peculado lo comete un servidor público con bienes del Estado.",r:"C. Penal art. 434A"},
// Determinación y control tributario
{c:1,t:"Fiscalización y liquidación tributaria y aduanera",q:"La fiscalización tributaria busca principalmente:",o:["Verificar la exactitud de las declaraciones y el cumplimiento de obligaciones, y determinar los tributos cuando corresponda","Cobrar coactivamente las deudas en firme","Resolver los recursos contra liquidaciones"],a:0,e:"El cobro y la resolución de recursos son procesos distintos (Recaudo y cobranzas, y Jurídica).",r:"ET art. 684"},
{c:1,t:"Fiscalización y liquidación tributaria y aduanera",q:"¿Cuál de estas actuaciones excede las facultades de fiscalización de la DIAN?",o:["Imponer penas privativas de la libertad","Citar o requerir al contribuyente o a terceros para que rindan informes","Ordenar la exhibición y examen parcial de libros y documentos"],a:0,e:"Las penas solo las impone un juez penal. Las otras dos sí son facultades de fiscalización.",r:"ET art. 684"},
{c:1,t:"Fiscalización y liquidación tributaria y aduanera",q:"El requerimiento ordinario de información sirve para:",o:["Pedir información y pruebas en una investigación, sin proponer modificaciones a la declaración","Proponer la modificación de la declaración privada","Notificar la liquidación oficial"],a:0,e:"El que propone modificaciones es el requerimiento especial (art. 703).",r:"ET art. 684 y 686"},
{c:1,t:"Fiscalización y liquidación tributaria y aduanera",q:"La inspección tributaria es:",o:["Un medio de prueba para verificar la exactitud de las declaraciones mediante la constatación directa de hechos","Un recurso a favor del contribuyente","Una sanción por no declarar"],a:0,e:"Se decreta mediante auto y de ella se levanta un acta.",r:"ET art. 779"},
{c:1,t:"Fiscalización y liquidación tributaria y aduanera",q:"Antes de proferir una liquidación oficial de revisión, la DIAN debe:",o:["Notificar un requerimiento especial que proponga las modificaciones","Imponer sanción por no enviar información","Emplazar para declarar"],a:0,e:"El requerimiento especial garantiza el derecho de defensa.",r:"ET art. 703"},
{c:1,t:"Fiscalización y liquidación tributaria y aduanera",q:"Si la DIAN tiene indicios de inexactitud, puede enviar un emplazamiento para corregir. ¿En qué plazo responde el contribuyente?",o:["1 mes desde su notificación","3 meses desde su notificación","10 días"],a:0,e:"El emplazamiento para corregir no es obligatorio antes del requerimiento especial.",r:"ET art. 685"},
{c:1,t:"Fiscalización y liquidación tributaria y aduanera",q:"La sanción general por inexactitud equivale a:",o:["El 100% de la diferencia entre el saldo a pagar determinado oficialmente y el declarado","El 5% por cada mes de retardo","10 UVT fijas"],a:0,e:"Hay casos con porcentajes mayores, por ejemplo cuando hay abuso tributario.",r:"ET art. 648"},
{c:1,t:"Fiscalización y liquidación tributaria y aduanera",q:"A quien no declaró pese al emplazamiento, la DIAN le determina la obligación mediante:",o:["Liquidación oficial de aforo","Liquidación de corrección aritmética","Requerimiento ordinario"],a:0,e:"Antes se impone la sanción por no declarar.",r:"ET art. 715-717"},
// Fiscalización internacional
{c:1,t:"Fiscalización internacional",q:"El régimen de precios de transferencia busca que las operaciones con vinculados del exterior se pacten:",o:["Como lo harían partes independientes en condiciones comparables (principio de plena competencia)","Al precio que las partes decidan libremente","Al valor que fije la DIAN para cada producto"],a:0,e:"Se conoce internacionalmente como arm's length.",r:"ET art. 260-1 y ss."},
{c:1,t:"Fiscalización internacional",q:"Los convenios para evitar la doble imposición tienen como finalidad, entre otras:",o:["Evitar que la misma renta se grave dos veces en distintos países y facilitar el intercambio de información","Eliminar todos los impuestos entre los países firmantes","Permitir el ingreso de mercancías sin aranceles"],a:0,e:"Los aranceles se negocian en tratados de libre comercio, no en estos convenios.",r:"CDI"},
{c:1,t:"Fiscalización internacional",q:"El estándar de la OCDE para el intercambio automático de información financiera con fines fiscales es:",o:["El Estándar Común de Reporte (CRS)","NANDINA","MIPG"],a:0,e:"Con Estados Unidos se aplica además FATCA.",r:"OCDE · CRS"},
{c:1,t:"Fiscalización internacional",q:"El régimen de Entidades Controladas del Exterior (ECE) busca:",o:["Gravar en Colombia las rentas pasivas obtenidas mediante sociedades del exterior controladas por residentes","Eximir de impuestos la inversión extranjera","Controlar el ingreso de divisas"],a:0,e:"Evita diferir el impuesto dejando las rentas pasivas en sociedades del exterior.",r:"ET art. 882 y ss."},
{c:1,t:"Fiscalización internacional",q:"La declaración anual de activos en el exterior la presentan:",o:["Los contribuyentes de renta con activos en el exterior cuyo valor patrimonial a 1 de enero supere 2.000 UVT","Todos los colombianos que viajen al exterior","Solo las sociedades extranjeras"],a:0,e:"Es una declaración informativa que permite cruzar información.",r:"ET art. 607"},
// Régimen cambiario
{c:1,t:"Normativa cambiaria",q:"¿Cuál de estas es una operación de cambio obligatoriamente canalizable por el mercado cambiario?",o:["Importación y exportación de bienes","Compra de bienes en el país pagada en pesos","Pago de nómina en pesos"],a:0,e:"También lo son, entre otras, el endeudamiento externo y las inversiones internacionales.",r:"Res. Externa 1/2018 JDBR"},
{c:1,t:"Normativa cambiaria",q:"Las divisas de operaciones obligatoriamente canalizables deben transferirse a través de:",o:["Los intermediarios del mercado cambiario o las cuentas de compensación","Cualquier persona natural que compre dólares","Directamente a la DIAN"],a:0,e:"Es lo que conforma el mercado cambiario regulado.",r:"Res. Externa 1/2018 JDBR"},
{c:1,t:"Normativa cambiaria",q:"Las cuentas de compensación son:",o:["Cuentas en el exterior registradas ante el Banco de la República para canalizar divisas de operaciones obligatoriamente canalizables","Cuentas de ahorro en pesos para pagar impuestos","Cuentas de la DIAN para devoluciones"],a:0,e:"Quien las tiene debe reportar sus movimientos.",r:"Res. Externa 1/2018 JDBR"},
{c:1,t:"Normativa cambiaria",q:"La DIAN ejerce control y vigilancia cambiaria sobre:",o:["Importaciones y exportaciones de bienes y servicios, sus gastos asociados y su financiación, entre otras","Exclusivamente la inversión extranjera directa","Las tasas de interés del sistema financiero"],a:0,e:"Otras operaciones cambiarias las vigila la Superintendencia de Sociedades.",r:"Dcto. 2245/2011"},
{c:1,t:"Normativa cambiaria",q:"Un exportador recibe el pago de sus exportaciones en efectivo y nunca lo canaliza por el mercado cambiario. Esta conducta:",o:["Puede constituir una infracción cambiaria sancionable por la DIAN","Es legal si el monto es alto","Solo genera sanción por IVA"],a:0,e:"Las divisas de las exportaciones de bienes deben canalizarse obligatoriamente.",r:"Dcto. 2245/2011"},
// Fiscalización aduanera
{c:1,t:"Fiscalización y liquidación tributaria y aduanera",q:"La aprehensión de mercancías es:",o:["Una medida cautelar que retiene mercancías cuando se configura una causal prevista en la ley","La sanción definitiva de pérdida de la propiedad","El permiso para retirar la mercancía del puerto"],a:0,e:"La pérdida definitiva de la mercancía es el decomiso.",r:"Dcto. 920/2023"},
{c:1,t:"Fiscalización y liquidación tributaria y aduanera",q:"El decomiso consiste en:",o:["Que pasen a propiedad de la Nación las mercancías cuya legal introducción, permanencia o circulación no se acreditó","Una medida cautelar provisional","Un tributo aduanero"],a:0,e:"Se decide al definir la situación jurídica de la mercancía aprehendida.",r:"Dcto. 920/2023"},
{c:1,t:"Fiscalización y liquidación tributaria y aduanera",q:"El control aduanero que se realiza después del levante de la mercancía se denomina:",o:["Control posterior","Control previo","Aforo"],a:0,e:"El control puede ser previo, simultáneo o posterior.",r:"Dcto. 1165/2019"},
{c:1,t:"Fiscalización y liquidación tributaria y aduanera",q:"Los tributos aduaneros comprenden:",o:["Los derechos de aduana (arancel) y el IVA en la importación","Solo el impuesto de renta","El GMF y el impuesto predial"],a:0,e:"Se liquidan en la declaración de importación.",r:"Dcto. 1165/2019 art. 3"},
{c:1,t:"Fiscalización y liquidación tributaria y aduanera",q:"Apoya una diligencia de destrucción de mercancía averiada bajo control aduanero. Lo esencial es:",o:["Verificar que la mercancía coincide con la autorizada y dejar en acta firmada qué se destruyó, la cantidad y el método","Destruirla sin registro para agilizar","Dejar que el importador conserve las partes útiles sin constancia"],a:0,e:"El acta da trazabilidad y soporta las consecuencias tributarias de la destrucción.",r:"Función esencial 4 del cargo"},
{c:1,t:"Fiscalización y liquidación tributaria y aduanera",q:"Al inventariar mercancía aprehendida encuentra menos unidades que las del acta de aprehensión. Usted:",o:["Registra la diferencia tal como la encontró e informa al superior para las actuaciones correspondientes","Ajusta el inventario para que coincida con el acta","Omite la diferencia porque es pequeña"],a:0,e:"Alterar o callar una diferencia puede ser falta disciplinaria e incluso delito.",r:"Función esencial 5 del cargo"},
// Lavado de activos y financiación del terrorismo
{c:1,t:"LA/FT, ROS y denuncias",q:"Un Reporte de Operación Sospechosa (ROS) se envía a:",o:["La Unidad de Información y Análisis Financiero (UIAF)","La Registraduría Nacional","La Superintendencia de Industria y Comercio"],a:0,e:"La UIAF es la unidad de inteligencia financiera de Colombia.",r:"Ley 526/1999"},
{c:1,t:"LA/FT, ROS y denuncias",q:"Las etapas típicas del lavado de activos son:",o:["Colocación, estratificación (ocultamiento) e integración","Planeación, ejecución y control","Inscripción, admisión y selección"],a:0,e:"El objetivo es dar apariencia de legalidad a recursos de origen ilícito.",r:"GAFI"},
{c:1,t:"LA/FT, ROS y denuncias",q:"Frente a un ROS, el servidor que conoce el reporte debe:",o:["Mantener la reserva y no informar al reportado","Avisar al reportado para que aclare la situación","Publicarlo en la página de la entidad"],a:0,e:"Revelarlo puede frustrar la investigación y acarrear responsabilidad.",r:"Ley 526/1999"},
{c:1,t:"LA/FT, ROS y denuncias",q:"La financiación del terrorismo se diferencia del lavado de activos en que:",o:["Los recursos pueden ser de origen lícito; lo determinante es su destino","Siempre proviene del narcotráfico","No es delito en Colombia"],a:0,e:"El lavado mira el origen ilícito de los recursos; la financiación del terrorismo, su destino.",r:"C. Penal art. 345"},
// Gestión documental
{c:1,t:"Gestión documental y trazabilidad",q:"La Ley General de Archivos en Colombia es:",o:["Ley 594 de 2000","Ley 87 de 1993","Ley 1712 de 2014"],a:0,e:"La Ley 87 es control interno y la Ley 1712 es transparencia.",r:"Ley 594/2000"},
{c:1,t:"Gestión documental y trazabilidad",q:"El instrumento que fija cuánto tiempo se conserva cada serie documental y su disposición final es:",o:["La Tabla de Retención Documental (TRD)","El formulario único tributario","El inventario de mercancías"],a:0,e:"La TRD define el tiempo en archivo de gestión y en archivo central, y la disposición final.",r:"Ley 594/2000; AGN"},
{c:1,t:"Gestión documental y trazabilidad",q:"Recibe un documento para un expediente de investigación. Para garantizar la trazabilidad, lo incorpora:",o:["En orden cronológico, foliado y registrado en el sistema, según el procedimiento","Al final de la carpeta, sin foliar","En una carpeta personal mientras se revisa"],a:0,e:"Sin trazabilidad, las pruebas del expediente pueden ser cuestionadas.",r:"Función esencial 6 del cargo"},
{c:1,t:"Gestión documental y trazabilidad",q:"La entidad rectora de la política archivística en Colombia es:",o:["El Archivo General de la Nación","La DIAN","La CNSC"],a:0,e:"Expide la normativa técnica de archivos.",r:"Ley 594/2000"},
// PQRSF y servicio al ciudadano
{c:1,t:"PQRSF y servicio al ciudadano",q:"PQRSF significa:",o:["Peticiones, quejas, reclamos, sugerencias y felicitaciones","Procesos, quejas, recursos, sanciones y fallos","Pagos, quejas, retenciones, saldos y facturas"],a:0,e:"Es el sistema de atención de requerimientos ciudadanos.",r:"Sistema PQRSF"},
{c:1,t:"PQRSF y servicio al ciudadano",q:"¿En qué se diferencia una queja de un reclamo?",o:["La queja se refiere a la conducta de un servidor; el reclamo, a un servicio deficiente o una solicitud no atendida","Son lo mismo","La queja solo se presenta por escrito"],a:0,e:"Es la definición usada en la política de servicio al ciudadano.",r:"Sistema PQRSF"},
{c:1,t:"PQRSF y servicio al ciudadano",q:"Recibe por escrito una petición que no es de competencia de la DIAN. Debe:",o:["Informarlo al peticionario y remitirla a la autoridad competente dentro de los 5 días siguientes","Rechazarla y archivarla","Responderla de todas formas"],a:0,e:"Si la petición es verbal, se informa en el mismo momento.",r:"Ley 1755/2015 art. 21"},
{c:1,t:"PQRSF y servicio al ciudadano",q:"Si una petición está incompleta, la autoridad:",o:["Requiere al peticionario dentro de los 10 días siguientes para que la complete en máximo un mes","La rechaza de plano","La archiva de inmediato"],a:0,e:"Si no completa a tiempo, opera el desistimiento tácito.",r:"Ley 1755/2015 art. 17"},
// CPACA (Título III)
{c:1,t:"CPACA: notificaciones y recursos",q:"Se envió citación para notificar personalmente un acto y el interesado no compareció en 5 días. Se notifica por:",o:["Aviso","Edicto en el Diario Oficial","Llamada telefónica"],a:0,e:"El aviso se envía con copia íntegra del acto.",r:"CPACA art. 68 y 69"},
{c:1,t:"CPACA: notificaciones y recursos",q:"Un acto administrativo queda en firme, entre otros casos:",o:["Cuando contra él no procede ningún recurso, desde el día siguiente a su notificación","Cuando el funcionario lo decide","Solo un año después de expedido"],a:0,e:"También queda en firme al vencer el término sin que se presenten recursos.",r:"CPACA art. 87"},
{c:1,t:"CPACA: notificaciones y recursos",q:"El recurso de apelación busca que:",o:["El inmediato superior administrativo aclare, modifique, adicione o revoque la decisión","El mismo funcionario que decidió revise su decisión","Un juez revise la decisión"],a:0,e:"La segunda opción describe el recurso de reposición.",r:"CPACA art. 74"},
{c:1,t:"CPACA: notificaciones y recursos",q:"La revocación directa de un acto administrativo procede, entre otras causales, cuando:",o:["Es manifiesta su oposición a la Constitución o a la ley","El funcionario cambió de opinión sin razones","El ciudadano no pagó a tiempo"],a:0,e:"Las otras causales: no estar conforme con el interés público o causar agravio injustificado a una persona.",r:"CPACA art. 93"},
// Buen gobierno y herramientas
{c:1,t:"Buen gobierno y herramientas",q:"El Código de Buen Gobierno de una entidad pública recoge:",o:["Las políticas y compromisos de la dirección para una gestión íntegra, eficiente y transparente","Las tarifas de los impuestos","El régimen de importaciones"],a:0,e:"Complementa el Código de Integridad.",r:"Código de Buen Gobierno"},
{c:1,t:"Buen gobierno y herramientas",q:"En Excel (en español), para sumar los valores de la columna B entre las filas 2 y 20 se escribe:",o:["=SUMA(B2:B20)","=SUMA(B2;B20)","=TOTAL(B2-B20)"],a:0,e:"Con punto y coma solo se suman las celdas B2 y B20; los dos puntos indican el rango.",r:"Herramientas informáticas"},
{c:1,t:"Buen gobierno y herramientas",q:"Para traer a una tabla un dato de otra según un identificador (por ejemplo, el NIT) en Excel se usa:",o:["BUSCARV o BUSCARX","CONCATENAR","REDONDEAR"],a:0,e:"Es muy útil para cruzar información en verificaciones.",r:"Herramientas informáticas"},
// Comportamentales de la ficha (orientativo)
{t:COMP,lk:1,k:"Orientación al usuario y al ciudadano",q:"Atiendo con el mismo trato respetuoso a todos los ciudadanos, sin importar cómo se expresen."},
{t:COMP,lk:1,k:"Integridad",q:"Rechazo cualquier obsequio de un contribuyente, incluso si es de poco valor."},
// ===== Casos tipo examen: formato PJS (caso + enunciado + 3 opciones) para Analista II =====
{c:1,p:1,t:"Fiscalización y liquidación tributaria y aduanera",cs:"En una bodega de la DIAN se custodian mercancías aprehendidas en un operativo. Le piden al técnico hacer el inventario físico para el expediente. Al contar encuentra 46 cajas, pero el acta de aprehensión registra 50.",q:"Para que el inventario sirva de soporte al expediente, al técnico le corresponde",o:["registrar las 46 cajas encontradas, dejar constancia de la diferencia frente al acta e informarla al responsable del caso.","registrar las 50 cajas del acta, por ser el documento oficial de la aprehensión, y anotar la observación aparte.","suspender el inventario hasta ubicar las 4 cajas faltantes y poder cuadrarlo con el acta."],a:0,j:["Correcta. El inventario debe reflejar lo que existe físicamente. Dejar constancia de la diferencia e informarla permite que el responsable adelante las actuaciones que correspondan y conserva la trazabilidad de la mercancía bajo medida cautelar.","Incorrecta. Registrar 50 cajas cuando hay 46 hace que el inventario no corresponda a la realidad. Un registro falso en un documento oficial puede ser falta disciplinaria e incluso delito.","Incorrecta. Suspender el inventario no resuelve la diferencia y retrasa el expediente. La tarea del técnico es registrar lo encontrado y reportar la novedad, no cuadrar las cifras."],r:"Función esencial 5 · Dcto. 920/2023"},
{c:1,p:1,t:"Fiscalización y liquidación tributaria y aduanera",cs:"Un importador obtuvo autorización para destruir mercancía averiada. En la diligencia, el técnico verifica que parte de la mercancía presentada tiene referencias distintas a las que aparecen en el acto que autorizó la destrucción.",q:"Frente a la diferencia encontrada, al técnico le corresponde",o:["destruir solo la mercancía que coincide con la autorizada, dejar constancia en el acta de las referencias que no coinciden e informar al funcionario responsable.","destruir toda la mercancía presentada, porque el importador manifiesta que toda está averiada.","cancelar la diligencia y devolver toda la mercancía al importador hasta que aclare la situación."],a:0,j:["Correcta. La diligencia solo cubre lo autorizado. El acta deja la trazabilidad de lo destruido y de la novedad, y el funcionario responsable decide sobre la mercancía no autorizada.","Incorrecta. La manifestación del importador no reemplaza el acto de autorización. Destruir mercancía no autorizada impide su control y puede ocultar irregularidades.","Incorrecta. La mercancía autorizada sí podía destruirse. Además, devolver mercancía con diferencias sin control aduanero desconoce el procedimiento."],r:"Función esencial 4 · Dcto. 1165/2019"},
{c:1,p:1,t:"Fiscalización y liquidación tributaria y aduanera",cs:"El técnico apoya la logística de un operativo de control en un establecimiento comercial. El jefe del operativo pide que la mercancía que se aprehenda quede plenamente identificada.",q:"Para cumplir esa instrucción, al técnico le corresponde",o:["relacionar en el acta cada mercancía con su descripción, cantidad, marca, referencia y estado, y rotular los bultos con el número del acta.","anotar el número total de cajas y un valor aproximado, para agilizar el traslado a la bodega.","tomar fotografías generales del establecimiento y anexarlas al acta en lugar de la relación detallada."],a:0,j:["Correcta. La identificación detallada permite el inventario, la custodia y la definición de la situación jurídica de la mercancía. El rótulo une cada bulto con su acta.","Incorrecta. Un total de cajas no identifica la mercancía. Sin descripción ni referencias no se puede verificar después qué fue aprehendido.","Incorrecta. Las fotografías pueden complementar el acta, pero no reemplazan la relación detallada de la mercancía."],r:"Funciones esenciales 2 y 5 · Dcto. 920/2023"},
{c:1,p:1,t:"Fiscalización y liquidación tributaria y aduanera",cs:"En una verificación posterior a importaciones, el técnico observa que una empresa declaró de forma sistemática precios unitarios muy inferiores a los de otras importaciones de la misma mercancía y el mismo origen.",q:"Frente a este hallazgo, al técnico le corresponde",o:["documentar la diferencia de precios con las fuentes consultadas y reportarla al funcionario a cargo para el estudio de valor.","concluir que la empresa cometió contrabando y proponer el decomiso de la mercancía.","descartar el hallazgo, porque las mercancías ya obtuvieron levante."],a:0,j:["Correcta. Puede ser un indicio de subvaloración. El técnico apoya con soportes, y el estudio de valor y las decisiones le corresponden al funcionario competente.","Incorrecta. Una diferencia de precios es un indicio, no una conclusión. Declarar contrabando y proponer el decomiso sin estudio excede la función de apoyo y vulnera el debido proceso.","Incorrecta. El levante no impide el control. La DIAN puede hacer control posterior sobre las mercancías ya liberadas."],r:"Control posterior · Acuerdo de Valor OMC"},
{c:1,p:1,t:"Fiscalización y liquidación tributaria y aduanera",cs:"En una investigación de renta, el funcionario a cargo necesita confirmar las compras que un contribuyente declaró como costos. Le pide al técnico apoyar la verificación con información de terceros.",q:"Para verificar los costos declarados, el técnico debe apoyar",o:["la preparación de requerimientos de información a los proveedores reportados y el cruce con la información exógena y la facturación electrónica.","la preparación de un requerimiento especial al contribuyente que proponga desconocer los costos.","la consulta de los costos de empresas similares del sector para estimar si son razonables."],a:0,j:["Correcta. La DIAN puede hacer cruces de información con terceros y pedirles información. Los cruces con la exógena y la factura electrónica permiten confirmar si las compras existieron.","Incorrecta. El requerimiento especial propone modificar la declaración y se elabora después de verificar. Proponer desconocer los costos sin verificarlos no tiene sustento probatorio.","Incorrecta. Comparar con el sector puede orientar la selección de casos, pero no prueba si las compras de este contribuyente existieron."],r:"ET art. 684 y 686"},
{c:1,p:1,t:"Fiscalización y liquidación tributaria y aduanera",cs:"En una inspección tributaria en las instalaciones de un contribuyente, el técnico apoya la revisión de libros. Al final de la jornada, el contribuyente entrega unos soportes adicionales.",q:"Para que lo actuado tenga valor probatorio, al técnico le corresponde apoyar",o:["la elaboración del acta de la inspección, con los hechos verificados y la relación de los documentos recibidos, firmada por quienes intervinieron.","la toma de fotografías de los soportes y su envío al funcionario para que los evalúe después.","la recepción de los soportes y su incorporación posterior al expediente sin necesidad de acta."],a:0,j:["Correcta. De la inspección tributaria se levanta un acta con los hechos, las pruebas y los fundamentos, y esa acta hace parte de la actuación posterior.","Incorrecta. Las fotografías no reemplazan el acta ni prueban por sí solas qué documentos se recibieron y en qué condiciones.","Incorrecta. Sin acta no queda constancia de lo recibido ni de lo verificado, y se pierde la trazabilidad de la prueba."],r:"ET art. 779"},
{c:1,p:1,t:"Fiscalización y liquidación tributaria y aduanera",cs:"El funcionario le pide al técnico organizar la lista de contribuyentes a quienes se les notificó emplazamiento para declarar, para saber a cuáles ya se les venció el plazo.",q:"Para establecer el vencimiento, el técnico debe contar",o:["un mes desde la fecha de notificación del emplazamiento a cada contribuyente.","un mes desde la fecha de expedición del emplazamiento.","tres meses desde la fecha de notificación del emplazamiento."],a:0,j:["Correcta. El emplazado tiene un mes para declarar, y los términos corren desde la notificación, que es cuando el contribuyente conoce el acto.","Incorrecta. Contar desde la expedición desconoce que el acto solo produce efectos frente al contribuyente cuando se le notifica.","Incorrecta. Tres meses es el plazo para responder el requerimiento especial, no el emplazamiento para declarar."],r:"ET art. 715"},
{c:1,p:1,t:"Evasión, elusión y contrabando",cs:"Al analizar información de un contribuyente, el técnico ve que redujo su impuesto de renta usando una deducción expresamente prevista en la ley y que tiene todos los soportes.",q:"Al clasificar el caso, el técnico debe entender que se trata de",o:["una conducta permitida, porque usar un beneficio previsto en la ley con soportes no es evasión ni abuso.","evasión, porque el impuesto a cargo del contribuyente disminuyó.","abuso tributario, porque toda reducción del impuesto es artificiosa."],a:0,j:["Correcta. La planeación tributaria lícita es válida. La evasión implica incumplir la ley, y el abuso exige operaciones artificiosas sin propósito económico real.","Incorrecta. Pagar menos impuesto no es evasión cuando la reducción proviene de un beneficio legal bien soportado.","Incorrecta. El abuso requiere operaciones sin propósito económico o comercial real, no simplemente usar un beneficio legal."],r:"ET art. 869"},
{c:1,p:1,t:"Normativa cambiaria",cs:"En una verificación cambiaria, el técnico revisa las exportaciones de bienes de una empresa y encuentra que los pagos recibidos del exterior no fueron canalizados por intermediarios del mercado cambiario ni por una cuenta de compensación.",q:"Con base en lo encontrado, al técnico le corresponde",o:["documentar las operaciones no canalizadas y reportarlas al funcionario a cargo como posible infracción cambiaria.","pedir a la empresa que incluya las divisas en su declaración de renta para corregir la situación.","trasladar el caso a la Superintendencia de Sociedades, porque el control cambiario no es competencia de la DIAN."],a:0,j:["Correcta. Las divisas de las exportaciones de bienes son de canalización obligatoria. La DIAN es competente para controlar estas operaciones, y el técnico apoya documentando el hallazgo.","Incorrecta. Declarar en renta no corrige el incumplimiento del régimen cambiario. Son obligaciones distintas.","Incorrecta. El control cambiario de las exportaciones e importaciones de bienes sí es competencia de la DIAN."],r:"Dcto. 2245/2011 · Res. Ext. 1/2018 JDBR"},
{c:1,p:1,t:"Fiscalización internacional",cs:"Por intercambio automático de información con otros países, el área identifica que un residente tiene cuentas en el exterior con saldos altos, pero no presentó la declaración de activos en el exterior.",q:"Para apoyar la acción de control, el técnico debe",o:["consolidar la información recibida, verificar si el contribuyente estaba obligado a declarar y entregar el resultado al funcionario competente.","contactar al contribuyente y enviarle la información recibida de otros países para que la explique.","descartar el caso, porque la información de otros países no sirve para las acciones de control en Colombia."],a:0,j:["Correcta. Primero hay que establecer si superaba el monto que obliga a declarar. La información de intercambio se usa para fines de control tributario por los canales competentes.","Incorrecta. La información recibida por intercambio es confidencial y se usa según los convenios. El técnico no debe entregarla directamente al contribuyente.","Incorrecta. Precisamente para esto existe el intercambio de información: sirve como insumo para las acciones de control tributario."],r:"ET art. 607 · Estándar CRS"},
{c:1,p:1,t:"LA/FT, ROS y denuncias",cs:"Al organizar documentos del proceso, el técnico encuentra un reporte de operación sospechosa elaborado por el área sobre un contribuyente. Un compañero de otra dependencia, que no participa en el caso, le pide una copia porque conoce al contribuyente.",q:"Frente a la solicitud, al técnico le corresponde",o:["negar la copia, por la reserva del reporte, y mantenerlo bajo los controles de acceso del expediente.","entregar la copia, porque el compañero es servidor de la DIAN y tiene acceso a la información institucional.","permitir que lo consulte sin llevarse copia, siempre que deje constancia de la consulta."],a:0,j:["Correcta. El reporte de operación sospechosa es reservado. Solo lo conocen quienes intervienen en el caso, y la reserva protege la investigación.","Incorrecta. Ser servidor de la DIAN no da acceso a toda la información reservada. El acceso depende de la función que se cumple en el caso.","Incorrecta. Consultarlo también es conocer información reservada. Dejar constancia no cambia el hecho de que el compañero no tiene una razón de servicio para conocerlo."],r:"Ley 526/1999 · Función esencial 6"},
{c:1,p:1,t:"Gestión documental y trazabilidad",cs:"Llega por correo electrónico a la dependencia una denuncia por presunta evasión de IVA de un establecimiento comercial. El técnico debe tramitarla para que llegue al grupo que selecciona los casos.",q:"Para garantizar la trazabilidad de la denuncia, al técnico le corresponde",o:["radicarla en el sistema de gestión documental, con su número de radicado, e incorporar los anexos recibidos.","reenviarla por correo al jefe del grupo para que decida si se tramita.","imprimirla y archivarla en la carpeta física de denuncias del año."],a:0,j:["Correcta. La radicación le da fecha cierta y número de seguimiento a la denuncia y permite saber quién la tiene y en qué estado está.","Incorrecta. Un reenvío por correo no deja registro institucional del trámite ni permite su seguimiento.","Incorrecta. Archivarla sin radicar ni trasladar impide que la denuncia se gestione y se pueda rastrear."],r:"Ley 594/2000 · Función esencial 6"},
{c:1,p:1,t:"Gestión documental y trazabilidad",cs:"En la dependencia hay expedientes de investigaciones terminadas hace varios años que ocupan espacio en el archivo de gestión. El jefe le pide al técnico organizar su transferencia.",q:"Para definir qué hacer con esos expedientes, el técnico debe consultar",o:["la Tabla de Retención Documental, que fija el tiempo de conservación y la disposición final de cada serie.","el inventario de bienes de la dependencia, para calcular cuánto espacio se libera.","a cada funcionario que tramitó los casos, para que decida si se conservan o se eliminan."],a:0,j:["Correcta. La TRD establece cuánto tiempo permanece cada serie en el archivo de gestión y en el central, y su disposición final.","Incorrecta. El inventario de bienes no regula los documentos ni su conservación.","Incorrecta. La conservación o eliminación de documentos no es una decisión personal. La definen los instrumentos archivísticos aprobados."],r:"Ley 594/2000 · AGN"},
{c:1,p:1,t:"PQRSF y servicio al ciudadano",cs:"Un periodista pide a la dependencia el número total de aprehensiones de mercancía que se hicieron el último año en la ciudad.",q:"Frente a la solicitud, al técnico le corresponde apoyar",o:["la entrega de la información estadística agregada, que es pública, sin datos que identifiquen a personas o empresas.","la negativa a la solicitud, porque toda la información de fiscalización es reservada.","la entrega del listado de empresas a las que se aprehendió mercancía, por ser información de interés público."],a:0,j:["Correcta. Las cifras agregadas no revelan información reservada y pueden entregarse, según el principio de máxima publicidad.","Incorrecta. La reserva es la excepción y protege datos concretos. No justifica negar estadísticas generales.","Incorrecta. Identificar a las empresas puede revelar información reservada de actuaciones en curso."],r:"Ley 1712/2014"},
{c:1,p:1,t:"CPACA: notificaciones y recursos",cs:"En un trámite regido por el CPACA debe notificarse personalmente un acto a un ciudadano. La citación se envió hace seis días hábiles y el ciudadano no ha comparecido.",q:"Para continuar con la notificación, al técnico le corresponde apoyar",o:["la notificación por aviso, remitiendo copia íntegra del acto a la dirección del interesado.","el archivo del trámite, porque el ciudadano no mostró interés en notificarse.","el envío de una nueva citación con otros cinco días para comparecer."],a:0,j:["Correcta. Si no es posible la notificación personal en los cinco días siguientes al envío de la citación, se notifica por aviso con copia íntegra del acto.","Incorrecta. Que el ciudadano no comparezca no termina el trámite. La ley prevé otra forma de notificarlo.","Incorrecta. La ley no prevé repetir la citación. Hacerlo dilata el trámite sin fundamento."],r:"CPACA art. 68 y 69"},
{c:1,p:1,t:"PQRSF y servicio al ciudadano",cs:"El representante legal de una empresa investigada pide examinar y obtener copias de los documentos de su propio expediente de fiscalización.",q:"Frente a la solicitud, al técnico le corresponde",o:["tramitarla para que el representante pueda examinar el expediente y obtener las copias, porque la reserva no se le opone al propio investigado.","negarla, porque el expediente tributario tiene reserva frente a todos.","indicarle que solo podrá conocer el expediente cuando se le notifique la liquidación oficial."],a:0,j:["Correcta. Los expedientes de fiscalización pueden ser examinados por el contribuyente o su apoderado. Así se garantizan el derecho de defensa y el debido proceso.","Incorrecta. La reserva protege la información frente a terceros, no frente al propio contribuyente.","Incorrecta. El contribuyente puede conocer su expediente durante la actuación, no solo al final."],r:"ET art. 583 y 729 · Const. art. 29"},
{c:1,lk:1,t:COMP,k:"Adaptabilidad",q:"Cambio mi forma de trabajar cuando se modifica un procedimiento, aunque el anterior me resultara más cómodo."},
{c:1,lk:1,t:COMP,k:"Comunicación efectiva",q:"Pido que me repitan una instrucción cuando no la entiendo, antes de empezar la tarea."},
{c:1,lk:1,t:COMP,k:"Comportamiento ético",q:"Cumplo los procedimientos de custodia de mercancías, aunque retrasen la diligencia."},
{c:1,lk:1,t:COMP,k:"Trabajo en equipo",q:"Comparto con el equipo la información que necesita para avanzar, aunque yo la haya conseguido con esfuerzo."},
{c:1,lk:1,t:COMP,k:"Integridad",q:"Doy la misma prioridad a los casos, sin importar quién es el contribuyente investigado."},
{c:1,lk:1,t:COMP,k:"Orientación al usuario y al ciudadano",q:"Dedico unos minutos extra a orientar a un ciudadano que necesita resolver un trámite urgente."},
// ===== Ejes oficiales del empleo 236762 que faltaban (consulta de indicadores del operador) =====
// Razonamiento matemático
{c:1,p:1,t:"Razonamiento matemático",cs:"Un establecimiento vendió en el bimestre $50.000.000 en bienes gravados con la tarifa general del IVA. Los precios de venta no incluían el IVA.",q:"Para revisar la declaración, el IVA generado que el técnico debe calcular es de",o:["$9.500.000.","$7.983.193.","$8.000.000."],a:0,j:["Correcta. Si la base no incluye el IVA, el impuesto es base × 19%: 50.000.000 × 0,19 = 9.500.000.","Incorrecta. Ese valor resulta de extraer el IVA como si los $50.000.000 ya lo incluyeran (50.000.000 ÷ 1,19 × 0,19). El caso dice que los precios no lo incluían.","Incorrecta. Corresponde a una tarifa del 16%, que no es la tarifa general vigente (19%)."],r:"ET art. 468 · cálculo de porcentajes"},
{c:1,p:1,t:"Razonamiento matemático",cs:"En una verificación, el técnico revisa una factura por un total de $1.190.000 que incluye el IVA del 19%.",q:"La base gravable de esa factura es",o:["$1.000.000.","$963.900.","$1.190.000."],a:0,j:["Correcta. Si el total incluye el IVA, la base se obtiene dividiendo: 1.190.000 ÷ 1,19 = 1.000.000.","Incorrecta. Restar el 19% del total (1.190.000 × 0,81) no devuelve la base, porque el 19% se calculó sobre la base y no sobre el total.","Incorrecta. Ese es el valor total de la factura, que ya incluye el impuesto."],r:"Cálculo de porcentajes"},
{c:1,p:1,t:"Razonamiento matemático",cs:"Un contribuyente presentó su declaración 2 meses y 10 días después del vencimiento, sin que la DIAN lo hubiera emplazado. El impuesto a cargo es $4.000.000. No aplique reducciones de sanción.",q:"La sanción por extemporaneidad que debe calcular el técnico es de",o:["$600.000.","$400.000.","$1.200.000."],a:0,j:["Correcta. Es el 5% por cada mes o fracción de mes. 2 meses y 10 días cuentan como 3 meses: 4.000.000 × 5% × 3 = 600.000.","Incorrecta. Cuenta solo 2 meses e ignora que la fracción de mes cuenta como un mes completo.","Incorrecta. Aplica el 10% por mes, que corresponde a la extemporaneidad después del emplazamiento (art. 642)."],r:"ET art. 641"},
{c:1,p:1,t:"Razonamiento matemático",cs:"Se importa una mercancía con valor en aduana de $20.000.000. El arancel es del 10% y el IVA en la importación es del 19%.",q:"El total de tributos aduaneros a liquidar es de",o:["$6.180.000.","$5.800.000.","$4.180.000."],a:0,j:["Correcta. Arancel: 20.000.000 × 10% = 2.000.000. El IVA se calcula sobre el valor en aduana más el arancel: 22.000.000 × 19% = 4.180.000. Total: 6.180.000.","Incorrecta. Calcula el IVA solo sobre el valor en aduana (3.800.000) y olvida que la base del IVA en la importación incluye el arancel.","Incorrecta. Ese es solo el IVA. Falta sumar el arancel."],r:"ET art. 459 · Dcto. 1165/2019"},
{c:1,p:1,t:"Razonamiento matemático",cs:"Una obligación de $10.000.000 lleva 73 días en mora. Para el ejercicio, use una tasa de interés moratorio anual del 24,36% y un año de 365 días.",q:"El interés moratorio aproximado es de",o:["$487.200.","$2.436.000.","$203.000."],a:0,j:["Correcta. El interés moratorio tributario se liquida por días: 10.000.000 × 24,36% × 73 ÷ 365 = 487.200.","Incorrecta. Es el interés de un año completo, no de 73 días.","Incorrecta. Es el interés de un mes (tasa anual ÷ 12). La mora fue de 73 días, no de un mes."],r:"ET art. 634 y 635 · tasa de ejemplo"},
{c:1,p:1,t:"Razonamiento matemático",cs:"Cuatro técnicos inventarían 600 cajas de mercancía aprehendida en 3 horas. Para otra bodega se asignan seis técnicos y hay 1.200 cajas.",q:"Si todos trabajan al mismo ritmo, el inventario de la nueva bodega tardará",o:["4 horas.","6 horas.","3 horas."],a:0,j:["Correcta. Cada técnico inventaría 600 ÷ (4 × 3) = 50 cajas por hora. Seis técnicos hacen 300 cajas por hora: 1.200 ÷ 300 = 4 horas.","Incorrecta. Tiene en cuenta que hay el doble de cajas, pero no que hay más técnicos.","Incorrecta. Supone que el aumento de técnicos compensa por completo el doble de cajas, y no es así: el personal aumenta 1,5 veces y las cajas, 2 veces."],r:"Regla de tres compuesta"},
{c:1,t:"Razonamiento matemático",q:"El recaudo de una seccional pasó de $80 millones a $92 millones. La variación porcentual es:",o:["15%","12%","13,04%"],a:0,e:"Variación = (92 − 80) ÷ 80 = 0,15. Siempre se divide entre el valor inicial. 12 es la diferencia en millones, no el porcentaje, y 13,04% resulta de dividir entre el valor final.",r:"Variación porcentual"},
{c:1,t:"Razonamiento matemático",q:"A un pago por servicios de $3.000.000 se le aplica una retención en la fuente del 4%. El valor retenido es:",o:["$120.000","$1.200.000","$12.000"],a:0,e:"3.000.000 × 4 ÷ 100 = 120.000. Las otras opciones corren mal la coma decimal.",r:"Cálculo de porcentajes"},
{c:1,t:"Razonamiento matemático",q:"En cinco bodegas hay 120, 135, 150, 95 y 100 unidades. El promedio de unidades por bodega es:",o:["120","125","135"],a:0,e:"Suma: 600. Promedio: 600 ÷ 5 = 120.",r:"Promedio aritmético"},
// Obligaciones formales y sustanciales
{c:1,t:"Obligaciones formales y sustanciales",q:"La obligación tributaria sustancial consiste en:",o:["Pagar el tributo, y surge al realizarse el hecho que la ley define como generador del impuesto","Presentar las declaraciones tributarias en los plazos fijados","Inscribirse en el RUT antes de iniciar actividades"],a:0,e:"Declarar e inscribirse en el RUT son obligaciones formales: deberes que permiten controlar y hacer efectiva la obligación sustancial.",r:"ET art. 1"},
{c:1,t:"Obligaciones formales y sustanciales",q:"¿Cuál de estas es una obligación formal?",o:["Expedir factura","Pagar el impuesto sobre la renta","Pagar los intereses moratorios"],a:0,e:"Las obligaciones formales son deberes de hacer: facturar, declarar, informar, inscribirse en el RUT o llevar contabilidad. Pagar es la obligación sustancial.",r:"ET art. 615 y 616-1"},
{c:1,p:1,t:"Obligaciones formales y sustanciales",cs:"Un contribuyente presentó a tiempo su declaración de IVA con saldo a pagar, pero no hizo el pago.",q:"Al revisar el caso, el técnico debe concluir que el contribuyente",o:["cumplió la obligación formal de declarar, pero incumplió la sustancial de pagar, lo que genera intereses moratorios.","no presentó la declaración, porque una declaración sin pago no produce efecto legal.","debe pagar solo la sanción por extemporaneidad, porque no pagó dentro del plazo."],a:0,j:["Correcta. Declarar y pagar son obligaciones distintas. La declaración de IVA es válida, y el saldo no pagado genera intereses de mora y puede cobrarse.","Incorrecta. La ineficacia por falta de pago aplica a las declaraciones de retención en la fuente (art. 580-1), no a la de IVA.","Incorrecta. La sanción por extemporaneidad castiga declarar tarde. Aquí declaró a tiempo; el incumplimiento es del pago."],r:"ET art. 580-1 y 634"},
