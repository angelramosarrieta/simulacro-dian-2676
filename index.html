{c:1,t:"Obligaciones formales y sustanciales",q:"Las declaraciones de retención en la fuente presentadas sin el pago total:",o:["No producen efecto legal alguno, salvo las excepciones que señala la ley","Son válidas y solo generan intereses moratorios","Se convierten automáticamente en liquidación oficial"],a:0,e:"Es una regla especial de las declaraciones de retención, porque el agente recauda dinero de terceros.",r:"ET art. 580-1"},
{c:1,t:"Obligaciones formales y sustanciales",q:"Un contribuyente cambió la dirección de su negocio. Actualizar el RUT es:",o:["Una obligación formal que debe cumplir a más tardar dentro del mes siguiente al cambio","Una obligación sustancial","Un trámite voluntario"],a:0,e:"No actualizar el RUT a tiempo puede generar sanción.",r:"DUR 1625/2016 · ET art. 658-3"},
{c:1,t:"Obligaciones formales y sustanciales",q:"Reportar a la DIAN la información exógena es:",o:["Una obligación formal de informar, cuyo incumplimiento puede sancionarse","Una obligación sustancial de pago","Un deber exclusivo de las entidades públicas"],a:0,e:"La exógena permite los cruces de información en fiscalización.",r:"ET art. 631 y 651"},
// Estructura organizacional de la DIAN
{c:1,t:"Estructura organizacional de la DIAN",q:"La estructura vigente de la DIAN está definida en:",o:["El Decreto 1742 de 2020","El Decreto 1165 de 2019","La Ley 1755 de 2015"],a:0,e:"El Decreto 1165 es el régimen de aduanas y la Ley 1755 regula el derecho de petición.",r:"Dcto. 1742/2020"},
{c:1,t:"Estructura organizacional de la DIAN",q:"En el nivel territorial, la DIAN cumple sus funciones principalmente mediante:",o:["Direcciones seccionales de impuestos, de aduanas, y de impuestos y aduanas","Las secretarías de hacienda de los departamentos","Superintendencias regionales"],a:0,e:"Las seccionales dependen del nivel central. Las secretarías de hacienda son autoridades territoriales distintas.",r:"Dcto. 1742/2020"},
{c:1,t:"Estructura organizacional de la DIAN",q:"La dependencia de la DIAN que ejerce funciones de policía fiscal y aduanera contra el contrabando es:",o:["La Policía Fiscal y Aduanera (POLFA)","La Dirección de Gestión Jurídica","La Defensoría del Contribuyente"],a:0,e:"La POLFA apoya el control aduanero y la lucha contra el contrabando y la evasión.",r:"Dcto. 1742/2020"},
// Misionalidad de la DIAN
{c:1,t:"Misionalidad de la DIAN",q:"El objeto de la DIAN es:",o:["Coadyuvar a garantizar la seguridad fiscal del Estado y la protección del orden público económico, administrando y controlando el cumplimiento de las obligaciones tributarias, aduaneras y cambiarias","Crear los impuestos nacionales y fijar sus tarifas","Dirigir la política monetaria y fijar la tasa de cambio"],a:0,e:"Crear impuestos le corresponde al Congreso, y la política monetaria y cambiaria a la Junta Directiva del Banco de la República.",r:"Dcto. 1742/2020"},
{c:1,t:"Misionalidad de la DIAN",q:"¿Cuál de estos impuestos NO administra la DIAN?",o:["El impuesto predial","El gravamen a los movimientos financieros","El IVA"],a:0,e:"El predial es un impuesto municipal. La DIAN administra los impuestos nacionales.",r:"Misionalidad DIAN"},
{c:1,t:"Misionalidad de la DIAN",q:"¿Cuál de estas actividades NO hace parte de la administración de los impuestos nacionales a cargo de la DIAN?",o:["Fijar por resolución las tarifas de los impuestos","Fiscalizar y liquidar los impuestos","Cobrar las deudas y tramitar las devoluciones"],a:0,e:"La DIAN recauda, fiscaliza, liquida, discute, cobra, devuelve y sanciona, pero no fija tarifas. Eso es reserva de ley (Const. art. 338).",r:"ET art. 691 · Const. art. 338"},
{c:1,p:1,t:"Misionalidad de la DIAN",cs:"En un punto de atención de la DIAN, un comerciante pregunta cómo pagar el impuesto de industria y comercio (ICA) de su negocio, porque cree que lo administra la DIAN.",q:"Frente a la consulta, al funcionario le corresponde",o:["explicarle que el ICA es un impuesto municipal y orientarlo hacia la secretaría de hacienda de su municipio.","recibir la información del pago y remitirla después al municipio.","indicarle que lo pague junto con su declaración de IVA."],a:0,j:["Correcta. La DIAN administra impuestos nacionales. Orientar bien al ciudadano sobre la entidad competente es parte de la buena atención.","Incorrecta. La DIAN no es competente para recibir ni tramitar pagos de impuestos municipales.","Incorrecta. El ICA no se declara ni se paga en la declaración de IVA, que es un impuesto nacional."],r:"Misionalidad DIAN"},
// Fiscalización y liquidación aduanera
{c:1,p:1,t:"Fiscalización y liquidación tributaria y aduanera",cs:"En control posterior, el técnico encuentra que en una declaración de importación se usó una subpartida arancelaria equivocada, con un arancel menor al que correspondía. La mercancía ya tuvo levante.",q:"Frente a este hallazgo, el procedimiento que debe apoyar el técnico es",o:["la expedición de una liquidación oficial, previo requerimiento especial aduanero, para cobrar los tributos dejados de pagar y la sanción que corresponda.","el archivo del caso, porque con el levante la declaración ya no puede revisarse.","la aprehensión inmediata de la mercancía, porque toda diferencia en la clasificación es contrabando."],a:0,j:["Correcta. Si la declaración tiene errores que afectan los tributos, la DIAN los corrige con una liquidación oficial, garantizando antes el derecho de defensa con el requerimiento especial aduanero.","Incorrecta. El levante no impide el control posterior dentro de los términos de firmeza.","Incorrecta. Un error de clasificación declarado ante la aduana no equivale a contrabando. La consecuencia es liquidar la diferencia, no aprehender."],r:"Dcto. 1165/2019 · Dcto. 920/2023"},
// Integridad (Likert)
{c:1,lk:1,t:COMP,k:"Compromiso",q:"Me quedo hasta terminar una tarea urgente del equipo cuando el plazo lo exige."},
{c:1,lk:1,t:COMP,k:"Diligencia",q:"Reviso los términos de cada expediente antes de que se venzan, aunque nadie me lo recuerde."},
{c:1,lk:1,t:COMP,k:"Honestidad",q:"Reconozco cuando no conozco un procedimiento, en lugar de responder sin estar seguro."},
{c:1,lk:1,t:COMP,k:"Respeto",q:"Escucho hasta el final a un compañero que no comparte mi opinión antes de responderle."},
// ===== Ampliación a 200 preguntas (v6) =====
// Fiscalización y liquidación tributaria y aduanera
{c:1,t:"Fiscalización y liquidación tributaria y aduanera",q:"Un contribuyente corrige voluntariamente su declaración, aumentando el saldo a pagar, antes de cualquier emplazamiento. La sanción por corrección es:",o:["10% del mayor valor a pagar","20% del mayor valor a pagar","100% de la diferencia"],a:0,e:"Si corrige después del emplazamiento para corregir, la sanción sube al 20%. El 100% es la sanción por inexactitud.",r:"ET art. 644"},
{c:1,t:"Fiscalización y liquidación tributaria y aduanera",q:"Cuando una sanción no se impone dentro de una liquidación oficial, la DIAN debe primero:",o:["Formular pliego de cargos","Enviar un requerimiento ordinario","Notificar una liquidación de aforo"],a:0,e:"El pliego de cargos garantiza el derecho de defensa. El investigado tiene un mes para responder.",r:"ET art. 637 y 638"},
{c:1,t:"Fiscalización y liquidación tributaria y aduanera",q:"Vencido el plazo del emplazamiento para declarar sin que el contribuyente declare, la DIAN le impone primero:",o:["La sanción por no declarar","La sanción por corrección","La sanción por inexactitud"],a:0,e:"Después de esa sanción puede venir la liquidación oficial de aforo.",r:"ET art. 643 y 716"},
{c:1,t:"Fiscalización y liquidación tributaria y aduanera",q:"La revisión de la contabilidad del contribuyente para verificar la exactitud de sus declaraciones se hace mediante:",o:["Inspección contable","Emplazamiento para declarar","Recurso de reconsideración"],a:0,e:"De la inspección contable se levanta un acta, firmada por los funcionarios y el contador o el revisor fiscal.",r:"ET art. 782"},
{c:1,t:"Fiscalización y liquidación tributaria y aduanera",q:"La liquidación oficial de aforo debe notificarse dentro de:",o:["Los 5 años siguientes al vencimiento del plazo para declarar","Los 3 años siguientes a la presentación de la declaración","El año siguiente al emplazamiento"],a:0,e:"Como no hay declaración, el término se cuenta desde el vencimiento del plazo para declarar.",r:"ET art. 717"},
{c:1,t:"Fiscalización y liquidación tributaria y aduanera",q:"Por regla general, la DIAN debe devolver un saldo a favor solicitado oportunamente y en debida forma dentro de:",o:["50 días hábiles","15 días hábiles","6 meses"],a:0,e:"Si la solicitud se presenta con garantía, el término es menor.",r:"ET art. 855"},
{c:1,t:"Fiscalización y liquidación tributaria y aduanera",q:"Una declaración con saldo a favor, cuya devolución se solicitó, queda en firme si no se notifica requerimiento especial dentro de:",o:["Los 3 años siguientes a la solicitud de devolución o compensación","Los 2 años siguientes a la presentación de la declaración","Los 5 años siguientes al vencimiento del plazo"],a:0,e:"Es una regla especial de firmeza para las declaraciones con saldo a favor.",r:"ET art. 714"},
{c:1,t:"Fiscalización y liquidación tributaria y aduanera",q:"La liquidación oficial de revisión debe referirse exclusivamente a:",o:["La declaración y los hechos contemplados en el requerimiento especial o en su ampliación","Cualquier hecho nuevo que la DIAN descubra después","Las declaraciones de otros años del contribuyente"],a:0,e:"Es la regla de correspondencia, que protege el derecho de defensa.",r:"ET art. 711"},
{c:1,t:"Fiscalización y liquidación tributaria y aduanera",q:"En materia tributaria, el requerimiento especial y las liquidaciones oficiales se pueden notificar:",o:["Electrónicamente, personalmente o por correo, según las reglas del Estatuto Tributario","Solo por edicto en la cartelera de la seccional","Solo por llamada telefónica"],a:0,e:"El Estatuto Tributario tiene reglas de notificación propias, distintas de las del CPACA.",r:"ET art. 565 y 566-1"},
{c:1,p:1,t:"Fiscalización y liquidación tributaria y aduanera",cs:"En una investigación de IVA, el técnico cruza las ventas declaradas con la facturación electrónica del contribuyente. Encuentra facturas emitidas por $30.000.000 que no aparecen en la declaración.",q:"Con base en el hallazgo, al técnico le corresponde",o:["consolidar el detalle de las facturas no declaradas, con sus soportes, y entregarlo al funcionario a cargo para que evalúe la propuesta de modificación.","corregir directamente la declaración del contribuyente en el sistema para incluir las ventas.","llamar al contribuyente para que consigne la diferencia y así cerrar la investigación."],a:0,j:["Correcta. El técnico apoya con la prueba organizada. La modificación de la declaración sigue el procedimiento: requerimiento especial y liquidación oficial.","Incorrecta. La DIAN no corrige directamente la declaración privada. La modifica con actos oficiales y respetando el debido proceso.","Incorrecta. Cerrar el caso por una llamada no tiene sustento en el procedimiento y desconoce las sanciones que correspondan."],r:"ET art. 702, 703 y 710"},
{c:1,p:1,t:"Fiscalización y liquidación tributaria y aduanera",cs:"En un control a un almacén, el técnico encuentra electrodomésticos de origen extranjero. El comerciante solo muestra una remisión interna, sin datos de la importación.",q:"Para continuar la diligencia, al técnico le corresponde apoyar",o:["la verificación de los documentos que acrediten la legal introducción de la mercancía y, si no se acredita, la aprehensión según el procedimiento, con acta detallada.","el cierre de la diligencia, porque la remisión interna demuestra que la mercancía se compró legalmente en el país.","el cobro inmediato de una multa en efectivo al comerciante para terminar el caso."],a:0,j:["Correcta. La mercancía extranjera debe estar amparada por documentos que prueben su legal introducción, como la declaración de importación o una factura que cumpla los requisitos. Si no se acredita, procede la medida cautelar con acta.","Incorrecta. Una remisión interna no prueba que la mercancía haya ingresado legalmente al país.","Incorrecta. La DIAN no cobra multas en efectivo en una diligencia. Las sanciones se imponen mediante actos administrativos y con debido proceso."],r:"Dcto. 1165/2019 · Dcto. 920/2023"},

const KEY="simulacro2676:v1", HKEY="simulacro2676:hist", PKEY="simulacro2676:pin", OKEY="simulacro2676:open";
function get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function put(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function storageOK(){try{localStorage.setItem("_t","1");localStorage.removeItem("_t");return true}catch(e){return false}}
function isOpen(){try{return sessionStorage.getItem(OKEY)==="1"}catch(e){return false}}
function setOpen(v){try{v?sessionStorage.setItem(OKEY,"1"):sessionStorage.removeItem(OKEY)}catch(e){}}
let stats=get(KEY)||{}, hist=get(HKEY)||[];
let S=null, timerId=null, simSize=30, tab="inicio", lockState=null;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function record(q,ok){if(q.lk)return;const s=stats[q.id]||{n:0,ok:0,last:null};s.n++;if(ok)s.ok++;s.last=ok;stats[q.id]=s;put(KEY,stats)}
function wrongIds(){return QG.filter(q=>stats[q.id]&&stats[q.id].last===false).map(q=>q.id)}
// Escala 0-100 con dos decimales truncados, como califica la CNSC (GOA 4.7)
function score(ok,n){return n?Math.floor(ok*10000/n)/100:0}
function fmt(x){return x.toFixed(2).replace(".",",")}
function topicStats(t){const qs=QG.filter(q=>q.t===t),seen=qs.filter(q=>stats[q.id]);
  const n=seen.reduce((a,q)=>a+stats[q.id].n,0),ok=seen.reduce((a,q)=>a+stats[q.id].ok,0);
  return {total:qs.length,seen:seen.length,acc:n?ok/n:null}}

// ---------- bloqueo con PIN (privacidad en este dispositivo) ----------
async function hashPin(p){
  try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("s2676|"+p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
  catch(e){let h=7;for(const c of "s2676|"+p)h=(h*31+c.charCodeAt(0))|0;return "f"+h}
}
function lockScreen(){
  clearInterval(timerId);S=null;setOpen(false);
  const has=!!get(PKEY);
  lockState={stage:has?"enter":"create",first:"",buf:"",err:"",forgot:false};
  drawLock();
}
function drawLock(){
  const L=lockState;
  const title={enter:"Ingresa tu PIN",create:"Crea un PIN de 4 dígitos",confirm:"Confirma tu PIN"}[L.stage];
  app.innerHTML=`<main class="lock gut"><div class="lockbox">
    <span class="mark">26</span>
    <div class="stack" style="gap:6px"><h1>${title}</h1><p class="muted">Simulacro DIAN 2676 · Analista II</p></div>
    <div class="dots${L.err?" err":""}" aria-label="${L.buf.length} de 4 dígitos">${[0,1,2,3].map(i=>`<i class="${i<L.buf.length?"on":""}"></i>`).join("")}</div>
    <p class="err-msg" role="alert">${esc(L.err)}</p>
    <div class="pad">${["1","2","3","4","5","6","7","8","9","","0","del"].map(k=>k===""?"<span></span>":k==="del"?`<button class="ghost" data-k="del" aria-label="Borrar">${I.del}</button>`:`<button data-k="${k}">${k}</button>`).join("")}</div>
    ${L.stage==="enter"?(L.forgot?`<div class="confirm" style="text-align:left"><p>Restablecer borra el PIN y tu progreso guardado en este dispositivo.</p><div class="acts"><button class="btn" id="nf">Cancelar</button><button class="btn danger" id="yf">Restablecer</button></div></div>`:`<button class="link" id="forgot">¿Olvidaste el PIN?</button>`)
      :`<p class="note">El PIN solo se guarda cifrado en este dispositivo. La página ya es privada para tu cuenta de Claude; el PIN agrega un bloqueo local.</p>`}
  </div></main>`;
  app.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>pinKey(b.dataset.k));
  const f=$("#forgot");if(f)f.onclick=()=>{L.forgot=true;drawLock()};
  const nf=$("#nf");if(nf)nf.onclick=()=>{L.forgot=false;drawLock()};
  const yf=$("#yf");if(yf)yf.onclick=()=>{put(PKEY,null);put(KEY,null);put(HKEY,null);stats={};hist=[];lockScreen()};
}
async function pinKey(k){
  const L=lockState;if(!L)return;
  if(k==="del"){L.buf=L.buf.slice(0,-1);L.err="";drawLock();return}
  if(L.buf.length>=4)return;
  L.buf+=k;L.err="";drawLock();
  if(L.buf.length<4)return;
  const pin=L.buf;
  if(L.stage==="create"){L.first=pin;L.buf="";L.stage="confirm";setTimeout(drawLock,120);return}
  if(L.stage==="confirm"){
    if(pin!==L.first){L.stage="create";L.first="";L.buf="";L.err="Los PIN no coinciden. Créalo de nuevo.";drawLock();return}
    put(PKEY,await hashPin(pin));unlock();return}
  if(await hashPin(pin)===get(PKEY)){unlock()}else{L.buf="";L.err="PIN incorrecto. Intenta de nuevo.";drawLock()}
}
function unlock(){lockState=null;setOpen(true);go("inicio")}
document.addEventListener("keydown",e=>{if(!lockState)return;if(/^[0-9]$/.test(e.key))pinKey(e.key);else if(e.key==="Backspace")pinKey("del")});

function start(list,m,label){
  if(!list.length)return;
  const timed=list.filter(q=>!q.lk).length;
  S={list:list.map(q=>({q,order:q.lk?[0,1,2,3]:shuffle([0,1,2]),pick:null})),i:0,mode:m,label,end:m==="sim"?Date.now()+timed*90e3:null,confirm:false};

  render();
}
function tick(){const el=$("#timer");if(!S||!S.end)return;const ms=S.end-Date.now();if(ms<=0){finish();return}
  if(el){const m=Math.floor(ms/6e4),s=Math.floor(ms/1e3)%60;el.textContent=`${m}:${String(s).padStart(2,"0")}`;el.classList.toggle("low",ms<12e4)}}
function feedback(it){
  const q=it.q,L="ABCD";
  if(q.lk)return `<div class="fb info"><strong>Sin respuesta correcta</strong><span>Competencia: ${esc(q.k)}.</span><span class="muted">Elige lo que de verdad haces normalmente. Si respondes casi todo con "Totalmente de acuerdo", las escalas de control pueden marcarlo como respuesta exageradamente favorable.</span></div>`;
  const ok=it.pick===q.a,key=`<span>Clave <b>${L[it.order.indexOf(q.a)]}</b> · ${esc(q.o[q.a])}</span>`;
  const why=q.j?`<span class="muted">${esc(q.j[q.a])}</span>${ok?"":`<span class="muted"><b style="color:var(--ink)">Tu opción ${L[it.order.indexOf(it.pick)]}:</b> ${esc(q.j[it.pick])}</span>`}`:`<span class="muted">${esc(q.e)}</span>`;
  return `<div class="fb ${ok?"ok":"bad"}"><strong>${ok?"Correcto":"Incorrecto"}</strong>${ok?"":key}${why}<span class="ref">${esc(q.r)}</span></div>`;
}
function render(){
  const it=S.list[S.i],q=it.q,n=S.list.length,sim=S.mode==="sim",answered=it.pick!==null;
  const L="ABCD",texts=q.lk?LK:q.o,lock=answered&&!sim&&!q.lk;
  const done=S.list.filter(x=>x.pick!==null).length;
  const opts=it.order.map((oi,k)=>{let c="opt";
    if(answered){if(sim||q.lk){if(it.pick===oi)c+=" sel"}else{if(oi===q.a)c+=" ok";else if(it.pick===oi)c+=" bad"}}
    return `<button class="${c}" data-oi="${oi}" ${lock?"disabled":""}><span class="l">${L[k]}</span><span>${esc(texts[oi])}</span></button>`}).join("");
  const head=q.cs?`<div class="caso"><span class="kicker">Caso</span><p>${esc(q.cs)}</p></div><span class="kicker">Enunciado</span>`:q.lk?`<span class="kicker">Afirmación · ${esc(q.k)}</span>`:"";
  const last=S.i===n-1;
  app.innerHTML=`
  <header class="qbar gut"><div class="inner">

    ${sim?`<span class="timer" id="timer">--:--</span>`:"<span></span>"}

    <p class="qtext">${esc(q.q)}</p>
    <div class="opts">${opts}</div>
    ${answered&&!sim?feedback(it):""}
    ${sim?`<div class="stack" style="gap:10px"><span class="kicker">${done} de ${n} respondidas</span><div class="grid">${S.list.map((x,k)=>`<button data-go="${k}" class="${x.pick!==null?"done":""} ${k===S.i?"cur":""}" aria-label="Pregunta ${k+1}">${k+1}</button>`).join("")}</div></div>`:""}
    <div id="confirm"></div>
  </div></main>
  <footer class="qnav gut"><div class="inner">
    ${sim?`<button class="btn" id="prev" ${S.i?"":"disabled"}>Anterior</button>`:""}
    ${!last?`<button class="btn primary" id="next" ${!sim&&!answered?"disabled":""}>Siguiente</button>`:`<button class="btn primary" id="fin" ${!sim&&!answered?"disabled":""}>${sim?"Terminar y calificar":"Ver resultado"}</button>`}
  </div></footer>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(lock)return;const first=it.pick===null;it.pick=+b.dataset.oi;if(!sim&&first)record(q,it.pick===q.a);render()});
  $("#exit").onclick=()=>{$("#confirm").innerHTML=`<div class="confirm"><p>${sim?"¿Salir del simulacro? No se calificará.":"¿Salir? Tus respuestas ya quedaron guardadas."}</p><div class="acts"><button class="btn" id="no">Seguir</button><button class="btn danger" id="yes">Salir</button></div></div>`;

function finish(){
  clearInterval(timerId);
  const sim=S.mode==="sim";
  if(sim)S.list.forEach(x=>{if(x.pick!==null)record(x.q,x.pick===x.q.a)});
  const graded=S.list.filter(x=>!x.q.lk),likert=S.list.filter(x=>x.q.lk&&x.pick!==null);
  const ok=graded.filter(x=>x.pick===x.q.a).length,n=graded.length,sc=score(ok,n);
  if(sim&&n){hist.unshift({d:Date.now(),l:S.label,s:sc,ok,n});hist=hist.slice(0,20);put(HKEY,hist)}
  const by=TOPICS.map(t=>{const xs=graded.filter(x=>x.q.t===t);return {t,n:xs.length,ok:xs.filter(x=>x.pick===x.q.a).length}}).filter(x=>x.n);
  const wrong=graded.filter(x=>x.pick!==x.q.a),top=likert.filter(x=>x.pick===3).length,label=S.label;
  const back=tab;
  app.innerHTML=`
  <header class="qbar gut"><div class="inner"><button class="icon-btn" id="close" aria-label="Cerrar">${I.x}</button><div class="qmeta"><b>Resultado</b><span>${esc(label)}</span></div><span></span></div></header>
  <div class="prog"><i style="width:100%"></i></div>
  <main class="quiz gut"><div class="inner" style="gap:28px">
    ${n?`<section class="hero"><div class="big">${fmt(sc)}<small>de 100</small></div><p>${ok} de ${n} correctas ${sc>=70?'<span class="pill ok">Supera el mínimo de 70,00</span>':'<span class="pill bad">Por debajo de 70,00</span>'}</p></section>`
      :`<section class="hero"><h1>Listo</h1><p class="muted">Respondiste ${likert.length} ${likert.length===1?"afirmación":"afirmaciones"} y marcaste "Totalmente de acuerdo" en ${top}.${likert.length&&top/likert.length>0.8?" Es una proporción muy alta: en la prueba real, las escalas de control pueden leerla como respuesta exageradamente favorable.":""}</p></section>`}
    ${by.length>1?`<section class="stack"><h2>Por tema</h2><div class="list">${by.map(b=>`<div class="row"><span class="t">${esc(b.t)}</span><span class="d">${b.ok} de ${b.n}</span><span class="r mono">${Math.round(b.ok/b.n*100)}%</span>${meter(b.ok/b.n)}</div>`).join("")}</div></section>`:""}
    ${wrong.length?`<section class="stack"><h2>Para repasar · ${wrong.length}</h2><div class="list">${wrong.map(x=>`<div class="rv"><span class="kicker">${esc(x.q.t)}</span>${x.q.cs?`<span class="muted">${esc(x.q.cs)}</span>`:""}<b style="font-weight:500">${esc(x.q.q)}</b>${x.pick!==null?`<span class="yours">Tu respuesta: ${esc(x.q.o[x.pick])}</span>`:`<span class="yours">Sin responder · cuenta como omisión</span>`}<span class="right">Correcta: ${esc(x.q.o[x.q.a])}</span><span class="muted">${esc(x.q.j?x.q.j[x.q.a]:x.q.e)}</span><span class="ref">${esc(x.q.r)}</span></div>`).join("")}</div></section>`:""}
  </div></main>
  <footer class="qnav gut"><div class="inner">
    <button class="btn" id="back">Volver</button>
    ${wrong.length?`<button class="btn primary" id="again">Practicar las ${wrong.length} falladas</button>`:""}
  </div></footer>`;
  const a=$("#again");if(a)a.onclick=()=>start(shuffle(wrong.map(x=>x.q)),"prac","Repaso de errores");
  $("#back").onclick=()=>go(back);$("#close").onclick=()=>go(back);
  S=null;window.scrollTo(0,0);
}

// ---------- arranque ----------
if(!storageOK()){go("inicio")}
else if(isOpen()&&get(PKEY)){go("inicio")}
else{lockScreen()}
</script>
</body>
</html>
